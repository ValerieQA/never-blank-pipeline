name: observation_score
status: ready
purpose: >
  Score a single observation on non-obviousness and specificity.
  Used to rank observations before adding them to the topic queue.

input_schema:
  statement:
    type: str
  observation_type:
    type: str
    enum: [pattern, paradox, reversal, gap, behavior_delta, signal_cluster, implication]
  portfolio_context:
    type: dict
    description: Current portfolio — to assess diversity value

output_schema:
  type: json_object
  fields:
    non_obviousness_score:
      type: float
      description: 0.0–1.0
    specificity_score:
      type: float
      description: 0.0–1.0
    composite_score:
      type: float
      description: Weighted average — non_obviousness * 0.6 + specificity * 0.4
    diversity_value:
      type: str
      description: high | medium | low — based on how underrepresented this type is in portfolio
    reasoning:
      type: str
      description: One sentence explaining the composite score

required_context:
  - statement
  - observation_type

constraints:
  - all scores must be floats between 0.0 and 1.0
  - composite_score must equal non_obviousness * 0.6 + specificity * 0.4 (rounded to 4 decimal places)
  - output must be valid JSON

failure_modes:
  - returns invalid JSON: retry once
  - scores out of range: clamp and log warning

system: |
  You score observations for Never Blank's content pipeline.

  You evaluate two dimensions:

  NON-OBVIOUSNESS (0.0–1.0):
  - 0.0–0.3: Generic. "Most founders underestimate content." Everyone knows this. Useless.
  - 0.4–0.6: Somewhat specific but still heard before. Needs more grounding.
  - 0.7–0.9: Genuinely surprising. Names something real that most people have not articulated.
  - 1.0: Extremely rare. A true reversal or paradox that reframes an assumption.

  SPECIFICITY (0.0–1.0):
  - 0.0–0.3: Vague. Could apply to any business, any founder, any situation.
  - 0.4–0.6: Names a domain but not a mechanism.
  - 0.7–0.9: Names the exact behavior, pattern, or mechanism. Reproducible.
  - 1.0: Names a specific, verifiable, nameable pattern with a clear mechanism.

  Format: Return valid JSON only. No text outside the JSON object.

user: |
  Score this observation.

  STATEMENT: {statement}
  OBSERVATION TYPE: {observation_type}
  PORTFOLIO CONTEXT: {portfolio_context_json}

  Return JSON with these exact keys:
  - "non_obviousness_score": float 0.0–1.0
  - "specificity_score": float 0.0–1.0
  - "composite_score": float (non_obviousness * 0.6 + specificity * 0.4)
  - "diversity_value": "high", "medium", or "low"
  - "reasoning": one sentence explaining the composite score
