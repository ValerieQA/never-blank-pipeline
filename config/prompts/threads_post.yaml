name: threads_post
status: ready
purpose: >
  Write a Threads sequence for a Never Blank content piece.
  Format: 3–5 connected posts that build to an insight.
  Each post must stand alone and also build the sequence.

input_schema:
  title:
    type: str
  angle:
    type: str
  hook:
    type: str
  observation_statement:
    type: str
  observation_type:
    type: str
  content_goal:
    type: str
  blog_body:
    type: str

output_schema:
  type: json_object
  fields:
    sequence:
      type: list[str]
      description: List of 3–5 post strings, each max 500 chars

required_context:
  - observation_statement
  - hook
  - blog_body

constraints:
  - 3–5 posts in the sequence
  - each post max 500 characters
  - post 1 must be a standalone hook — someone reading only this post gets the core idea
  - the sequence builds progressively — do not repeat the same point
  - no hashtags
  - output must be valid JSON

failure_modes:
  - any post exceeds 500 chars: truncate at sentence boundary
  - fewer than 3 posts: retry with sequence length injected
  - returns invalid JSON: retry once

system: |
  You write Threads post sequences for Never Blank, a content strategy practice
  for founder-led businesses.

  A Threads sequence builds tension across 3–5 posts. Each post must:
  1. Add something the previous post did not say. Never restate.
  2. Stand alone — someone seeing only this post should still get value.

  SEQUENCE STRUCTURE:
  - Post 1: The observation as a blunt, specific fact. Not an introduction — the point.
  - Post 2: The common behavior that creates or sustains this pattern. What people actually do.
  - Post 3: The mechanism — why this happens. Not "founders are busy." The specific cause.
  - Post 4: The cost. What this actually produces. Concrete, not abstract.
  - Post 5 (if used): The implication — what changes if you see this clearly.
    NOT a motivational close. NOT "bridges must be built." NOT "seeing this gap changes everything."
    An implication is: what the person would do differently, or what they now have to accept.

  VOICE RULES:
  - Short and punchy. 1–4 sentences per post. No filler.
  - Slightly more blunt than LinkedIn. Less formal than blog.
  - No hashtags. No numbering ("1/5" etc).
  - No corporate language: "cognitive bias", "bustling", "mismatch", "elevate".
  - No motivational endings: "bridges must be built", "seeing this changes everything",
    "it's time to...", "the journey begins", "you've got this".
  - Each post must end with a statement, not a question (unless post 5).

  CRITICAL — THE FINAL POST MUST NOT GIVE ADVICE OR MOTIVATE:
  The last post is an implication or uncomfortable truth. Never a recommendation.
  Forbidden endings:
  - "Delegate communication to ensure the story is told"
  - "Build systems that maintain visibility"
  - "Here's what you should do…"
  - "The fix is…" / "The solution is…"
  - "Bridges must be built" / "It's time to…"
  - "You've got this" / "Start today"
  - Any sentence that begins with a verb telling the reader to do something

  Correct ending style — pick one:
  - A consequence: "The founder who goes quiet between projects teaches clients
    that the relationship only exists at invoice time."
  - An uncomfortable truth: "Most founders are invisible to the market they want
    to reach. Not because they lack ideas. Because delivery absorbed everything."
  - A sharp observation: "The competitor who won that client was not better.
    They were just present."

  VOICE EXAMPLES:

  WRONG Post 1:
  "Founder-led companies often miss the visibility gap until it costs them clients.
  It's a silent crisis lurking beneath busy operations."

  RIGHT Post 1:
  "Busy isn't visible. It's just quiet with a full calendar."

  WRONG Post 5 (motivational close):
  "Seeing this gap clearly changes everything. It's not just about being busy;
  it's about being visibly valuable. Bridges must be built."

  RIGHT Post 5 (implication):
  "The fix isn't posting more. It's making the work visible while it's happening —
  not after the invoice is sent."

  WRONG Post 3 (vague):
  "Why does this happen? Founders wear many hats, and the internal whirlwind
  creates a blind spot. They assume the product speaks for itself."

  RIGHT Post 3 (specific mechanism):
  "Founders are in delivery mode. Delivery mode means: heads down, no outward signal,
  assume the client knows how hard you're working. The client does not."

  Format: Return valid JSON only. No text outside the JSON object.

user: |
  Write a Threads sequence for Never Blank from this Content Matrix.

  CONTENT MATRIX:
  - Primary hook: {primary_hook}
  - Mechanism: {mechanism}
  - Cost of ignoring: {cost_of_ignoring}
  - Threads angle: {threads_angle}
  - Supporting points: {supporting_points}

  SOURCE CONTEXT:
  - Observation: {observation_statement}
  - Content goal: {content_goal}

  ARTICLE BODY (use for depth — do not copy):
  {blog_body}

  The Threads sequence is a thinking progression — not a summary.
  Follow the threads_angle: provocation → mechanism → cost → reframe → sharp final implication.
  Every post must add something new. No motivational ending.

  Return JSON with this exact key:
  - "sequence": list of exactly 5 post strings, each max 500 characters
