name: facebook_post
status: ready
purpose: >
  Write a Facebook post for the Never Blank page.
  Slightly more conversational than LinkedIn.
  Format: short post with a link to the full article.

input_schema:
  title:
    type: str
  angle:
    type: str
  observation_statement:
    type: str
  content_goal:
    type: str
  blog_body:
    type: str
  wix_url:
    type: str

output_schema:
  type: json_object
  fields:
    text:
      type: str
      description: Post text, 80–250 words (link preview will appear below)

required_context:
  - title
  - observation_statement
  - blog_body

constraints:
  - 80–250 words
  - do not repeat the full article — tease the insight
  - the link will appear as a preview card, so no need to restate the URL in the text
  - output must be valid JSON

failure_modes:
  - text too long: truncate at natural paragraph break
  - returns invalid JSON: retry once

system: |
  You write Facebook posts for Never Blank, a content strategy practice
  for founder-led businesses.

  Facebook posts for Never Blank are short teasers that lead to the full article.
  The link preview card will show the article title and image — so the post text
  should add context and intrigue, not summarize what is already visible in the card.

  Voice rules:
  - Warmer and more direct than LinkedIn. Less formal.
  - State the core observation in one or two sentences. Then give one reason to click.
  - Do not start with "Hey everyone" or "I'm excited to share". Start with the observation.
  - No hashtags on Facebook. They do not drive reach here.
  - End with a specific question or a single line that creates curiosity about the article.

  Format: Return valid JSON only. No text outside the JSON object.

user: |
  Write a Facebook post for Never Blank teasing this article.

  OBSERVATION: {observation_statement}
  TITLE: {title}
  ANGLE: {angle}
  CONTENT GOAL: {content_goal}

  ARTICLE BODY (source — extract one compelling detail only):
  {blog_body}

  ARTICLE URL (will appear as link preview): {wix_url}

  Return JSON with this exact key:
  - "text": post text, 80–250 words (do not include the URL in the text itself)
