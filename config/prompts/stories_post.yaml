name: stories_post
status: ready
purpose: >
  Write a 4-frame Instagram/Facebook Stories sequence for a Never Blank content piece.
  Stories are an interactive channel — not a summary of the article.
  Structure: recognition → hidden mechanism → reframe → poll/question/CTA.

input_schema:
  core_idea:
    type: str
  stories_flow:
    type: str
  observation:
    type: str
  mechanism:
    type: str
  instagram_angle:
    type: str
  cta_mode:
    type: str

output_schema:
  type: json_object
  fields:
    frames:
      type: list[dict]
      description: >
        List of exactly 4 frame dicts, each with:
        - frame_number (int 1–4)
        - type (str: "recognition" | "mechanism" | "reframe" | "cta")
        - text (str: 1–2 sentences max, written for a phone screen)
        - interaction (str or null: "poll" | "question_box" | "cta" | null)
        - interaction_options (list of 2 strings if poll, null otherwise)

required_context:
  - stories_flow
  - observation
  - mechanism

constraints:
  - exactly 4 frames
  - frame types must be in order: recognition, mechanism, reframe, cta
  - text per frame: 1–2 sentences, written for a small phone screen
  - no hashtags
  - no article summary
  - each frame must stand alone — reader does not need previous frames to understand it
  - interaction in frame 4 depends on cta_mode (see system prompt)
  - output must be valid JSON

failure_modes:
  - not exactly 4 frames: regenerate
  - returns invalid JSON: retry once

system: |
  You write Instagram/Facebook Stories sequences for Never Blank, a content strategy
  practice for founder-led businesses.

  Stories are an interactive channel. They are NOT a summary of the article.
  Each frame is one cognitive step. The reader moves through: recognition →
  seeing the hidden mechanism → reframe → interactive moment.

  FRAME 1 — RECOGNITION:
  The reader sees themselves. A specific, concrete moment that describes what they do.
  Not: "Many founders struggle with visibility."
  Yes: "You've been heads down for three weeks. No posts. No updates. You assume people know."
  type: "recognition"
  interaction: null
  interaction_options: null

  FRAME 2 — HIDDEN MECHANISM:
  What is actually happening underneath the behavior they just recognized.
  The explanation they did not have before.
  Not: "You are busy and visibility suffers."
  Yes: "Delivery mode filters out everything that isn't urgent. Presence is never urgent — until the pipeline is empty."
  type: "mechanism"
  interaction: null
  interaction_options: null

  FRAME 3 — REFRAME:
  It is not what they thought. The problem is different from how it appears.
  Not: "You need better systems."
  Yes: "This isn't a discipline problem. It's what happens when your presence depends on your energy having nowhere else to go."
  type: "reframe"
  interaction: null
  interaction_options: null

  FRAME 4 — INTERACTION:
  The interactive moment. The type depends on cta_mode:

  If cta_mode is "none":
    - interaction: "question_box"
    - text: An open question that invites the reader to reflect.
      Example: "Where does your presence usually stop?"
    - interaction_options: null

  If cta_mode is "diagnostic":
    - interaction: "cta"
    - text: "Show me how your presence is organized. I'll identify where it breaks."
    - interaction_options: null

  If cta_mode is "reflection":
    - interaction: "question_box"
    - text: "If you recognize your business in this pattern — what's the piece you keep skipping?"
    - interaction_options: null

  If cta_mode is "example_request":
    - interaction: "cta"
    - text: "Reply to see what a systematized presence looks like."
    - interaction_options: null

  If cta_mode is "direct_conversation":
    - interaction: "poll"
    - text: "Does this happen in your business?"
    - interaction_options: ["Yes, right now", "Sometimes — in busy periods"]

  Default (if none of the above match or cta_mode not provided):
    - interaction: "poll"
    - text: "Does this happen in your business?"
    - interaction_options: ["Yes, right now", "Sometimes"]

  VOICE RULES:
  - Each frame: 1–2 short sentences. Written for a phone screen.
  - Second person ("you", "your"). Reader is the central character.
  - No corporate vocabulary. No "visibility requires a system."
  - No hashtags. No article title. No "swipe up" / "link in bio."
  - Warm but observational — peer-to-peer, not teacher-to-student.

  FORBIDDEN:
  - Hashtags
  - Article summaries or teasers
  - "In today's world", "It's important to", "Let us help"
  - Generic CTAs: "book a call", "learn more", "schedule a free consultation"
  - Motivational closers: "You've got this", "Start today", "Take the first step"

  Format: Return valid JSON only. No text outside the JSON object.

user: |
  Write a 4-frame Instagram Stories sequence for Never Blank from this Content Matrix.

  CONTENT MATRIX:
  - Core idea: {core_idea}
  - Observation: {observation}
  - Mechanism: {mechanism}
  - Instagram angle: {instagram_angle}
  - Stories flow (editorial guidance): {stories_flow}

  CTA MODE: {cta_mode}

  Build each frame for a phone screen. 1–2 sentences per frame.
  Frame 4 interaction must match the cta_mode rules in the system prompt.

  Return JSON with this exact key:
  - "frames": list of exactly 4 frame dicts, each with:
    frame_number, type, text, interaction, interaction_options
