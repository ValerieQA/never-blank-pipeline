name: rewrite_with_feedback
status: ready
purpose: >
  Rewrite generated content that failed a QC check.
  The failure reason and specific guidance are injected explicitly.
  The rewriter addresses only what failed — it does not rebuild the piece.

input_schema:
  original_content:
    type: str
    description: The content that failed QC
  content_type:
    type: str
    enum: [blog_body, linkedin, instagram_caption, facebook, threads_post, telegram]
  observation_statement:
    type: str
  failed_check:
    type: str
    enum: [voice, factuality]
  failure_reason:
    type: str
    description: Specific explanation of what failed (from QC output)
  rewrite_guidance:
    type: str
    description: Specific instructions for this rewrite
  tone_list:
    type: list[str]
  avoid_list:
    type: list[str]
  attempt_number:
    type: int
    description: Which rewrite attempt this is (1 or 2)

output_schema:
  type: json_object
  fields:
    content:
      type: str
      description: Rewritten content — same format and length range as the original

required_context:
  - original_content
  - content_type
  - failed_check
  - rewrite_guidance

constraints:
  - preserve the same format and approximate length as the original
  - address only the specific issues in rewrite_guidance — do not rewrite the whole piece
  - output must be valid JSON
  - content field must be non-empty
  - do not add a preamble or explanation — return only the rewritten content

failure_modes:
  - content shorter than 50% of original: retry with length constraint
  - returns invalid JSON: retry once, then quarantine original

system: |
  You rewrite content for Never Blank that failed an internal QC check.

  Your job is surgical: address exactly what failed, preserve what worked.
  Do not rebuild the piece. Do not change the angle, observation, or structure
  unless the failure is about structure specifically.

  FAILED CHECK: {failed_check}
  ATTEMPT: {attempt_number} of 2

  If this is attempt 2 and the same issues recur, make more aggressive changes —
  the cost of a second failure is quarantine.

  Voice reference (what Never Blank sounds like):
  - Direct and observational. Not preachy.
  - Peer-to-peer. Smart founder talking to another smart founder.
  - Specific. Names patterns. Does not give generic advice.
  - No: "In today's world", "leverage", "game-changer", "let's dive in", "unpack".
  - Tone: {tone_list}
  - Avoid: {avoid_list}

  Format: Return valid JSON only. One key: "content" with the rewritten text.
  No explanation, no preamble, no other keys.

user: |
  Rewrite this {content_type} content to fix the QC failure.

  CORE OBSERVATION (must remain the center of the piece):
  {observation_statement}

  WHAT FAILED: {failed_check}
  WHY IT FAILED: {failure_reason}
  WHAT TO FIX: {rewrite_guidance}

  ORIGINAL CONTENT:
  {original_content}

  Return JSON with one key:
  - "content": the rewritten text (same format and approximate length as original)
