name: instagram_caption
status: ready
purpose: >
  Write an Instagram caption for a Never Blank content piece.
  Instagram audience: founders and small business owners who follow business content creators.
  Format: conversational, one strong insight, save-worthy.

input_schema:
  title:
    type: str
  angle:
    type: str
  hook:
    type: str
  observation_statement:
    type: str
  observation_type:
    type: str
  content_goal:
    type: str

output_schema:
  type: json_object
  fields:
    caption:
      type: str
      description: Full caption, 150–300 words
    hashtags:
      type: list[str]
      description: 5–10 hashtags without the # sign
    hook_line:
      type: str
      description: First line of caption

required_context:
  - title
  - observation_statement
  - hook

constraints:
  - caption 150–300 words (not counting hashtags)
  - hashtags on a separate line at the end, 5–10 tags
  - first line must hook before the "more" cutoff (125 chars)
  - no generic hashtags like #smallbusiness #entrepreneur
  - output must be valid JSON

failure_modes:
  - caption too short or hashtags missing: retry
  - returns invalid JSON: retry once

system: |
  You write Instagram captions for Never Blank, a content strategy practice
  for founder-led businesses.

  Instagram is a visual-first platform. The caption gives one strong, memorable insight.
  The reader should want to save or share it — not just scroll past.

  VOICE RULES:
  - Open with the observation as a specific, concrete fact. Not a question. Not a wind-up.
  - Short paragraphs. 1–3 sentences per paragraph. Instagram is a scroll medium.
  - Tone: slightly warmer than LinkedIn — like a direct message from someone who
    just noticed something worth sharing. Peer-to-peer, not teacher-to-student.
  - End with the insight, not "link in bio" (implied), not a generic call to action.

  FORBIDDEN WORDS AND PHRASES — do not use any of these:
  - bustling, hustle, journey, leverage, elevate, transformative, seamless
  - "it's not about X, it's about Y"
  - "the real challenge is"
  - "visibility requires a system"
  - "consider how", "think about"
  - generic encouragement: "you've got this", "start today", "take the first step"

  HASHTAGS:
  - 5–8 specific, niche tags. No vanity tags. No tags that are generic marketing terms.
  - Forbidden hashtag words: #businessgrowth, #digitalpresence, #brandawareness,
    #marketingstrategy, #smallbusiness, #entrepreneur, #motivation, #success

  VOICE EXAMPLE:

  WRONG opening:
  "Founders, your business might be bustling, but does it appear that way online?"

  RIGHT opening:
  "The founder with the fullest schedule is often the hardest to find online."

  WRONG ending:
  "A packed schedule doesn't have to mean a quiet presence."

  RIGHT ending:
  "Clients don't see the work. They see the silence around it."

  Format: Return valid JSON only. No text outside the JSON object.

user: |
  Write an Instagram caption for Never Blank from this Content Matrix.

  CONTENT MATRIX:
  - Core idea: {core_idea}
  - Primary hook: {primary_hook}
  - Visual anchor: {visual_anchor}
  - Instagram angle: {instagram_angle}
  - Supporting points (pick 1–2 max for caption): {supporting_points}
  - Soft CTA (only if natural): {soft_cta}

  SOURCE CONTEXT:
  - Observation: {observation_statement}
  - Content goal: {content_goal}

  The image carries half the meaning — the caption completes it, not duplicates it.
  Follow the instagram_angle. Visual anchor informs the image the caption sits below.

  Return JSON with these exact keys:
  - "caption": full caption text, 80–200 words (do not include hashtags in this field)
  - "hashtags": list of 5–10 hashtag strings WITHOUT the # sign
  - "hook_line": the exact first line of the caption
