schedule:
  timezone: America/New_York
  days:
    # Monday and Wednesday moved to independent canonical streams (#142/#143).
    - friday
  # #224: the publication hour is unchanged; only the minute inside it moved
  # off the top of the hour, where GitHub delays scheduled runs the most. This
  # value and the workflow's cron minute must agree — the scheduling seam
  # identifies the firing by matching the cron's intended local time against
  # exactly this string, and a test pins the two together.
  time: "06:17"
  jitter_minutes: 0

publication_order:
  - wix
  - linkedin
  - facebook
  - instagram
  - threads
  - telegram

channel_behavior:
  wix:
    role: primary
    required: true
    # If Wix fails, channels that need the article URL will not publish.
    provides_url: true

  linkedin:
    role: social
    required: false
    needs_wix_url: false

  facebook:
    role: social
    required: false
    needs_wix_url: false

  instagram:
    role: social
    required: false
    needs_wix_url: false

  threads:
    role: social
    required: false
    needs_wix_url: false

  telegram:
    role: social
    required: false
    needs_wix_url: true   # Telegram appends "Read more →" link to Wix article

fallback_rules:
  wix_failure: skip_url_dependent_channels
  social_failure: continue_remaining_channels
  content_failure: abort_cycle
  qc_failure: abort_cycle
  image_failure: continue_without_image
