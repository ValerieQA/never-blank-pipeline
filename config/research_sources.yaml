rss_feeds:
  # Small business and service business sources (primary)
  - name: Small Business Trends
    url: https://smallbiztrends.com/feed
    quality: high
  - name: SCORE Small Business
    url: https://www.score.org/blog/feed
    quality: high
  - name: Entrepreneur Magazine
    url: https://www.entrepreneur.com/latest.rss
    quality: high
  - name: Inc. Magazine
    url: https://www.inc.com/rss.xml
    quality: high
  - name: HubSpot Marketing Blog
    url: https://blog.hubspot.com/marketing/rss.xml
    quality: medium
  - name: Content Marketing Institute
    url: https://contentmarketinginstitute.com/feed/
    quality: high
  - name: Search Engine Journal
    url: https://www.searchenginejournal.com/feed/
    quality: medium

  # Business behavior and trust research (secondary — for mechanism evidence)
  - name: Harvard Business Review
    url: https://hbr.org/the-latest/rss
    quality: high
  - name: Axios Business
    url: https://api.axios.com/feed/
    quality: medium
  - name: CNBC Small Business
    url: https://www.cnbc.com/id/48427006/device/rss/rss.html
    quality: high

  # Reuters/WSJ/AP blocked on GitHub Actions runners — kept below for reference
  # - name: Reuters Business
  #   url: https://feeds.reuters.com/reuters/businessNews

lookback_hours: 72
max_candidates: 30
min_candidates: 5

signal_categories:
  # Mechanism types — what the system is looking for is observable behavior patterns, not topics
  - visibility interruption
  - presence maintenance failure
  - customer memory formation
  - owner bottleneck
  - delivery vs visibility conflict
  - recognition system breakdown
  - trust accumulation pattern
  - consistency failure
  - business becoming invisible
  - authority erosion
  - communication gap during busy periods
  - platform reach change for small business
  - referral and word-of-mouth mechanism
  - silence and forgetting pattern

avoid_categories:
  - large company M&A with no small business visibility mechanism
  - generic AI hype and model releases
  - earnings reports and investor news
  - macroeconomic forecasts without owner-facing mechanism
  - motivational content and success mindset
  # The following are the hardest to filter — tips articles from small-biz sources
  - listicles ("5 ways to...", "top tools for...")
  - generic how-to advice without observable mechanism
  - trend roundups without behavioral observation
  - opinion-only without data or real business case
  - social media tips without mechanism (posting frequency, hashtag advice)
