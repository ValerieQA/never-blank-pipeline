  # Reuters/WSJ/AP blocked on GitHub Actions runners — kept below for reference
  # - name: Reuters Business
  #   url: https://feeds.reuters.com/reuters/businessNews

lookback_hours: 72
max_candidates: 30
min_candidates: 5

signal_categories:
  # Core Never Blank territory — small business visibility and presence
  - business visibility collapse
  - presence system failure
  - owner dependency on personal energy
  - consistency and customer memory
  - communication stopping during busy periods
  - client work defeating content work
  - trust built through repeated contact
  - recognition and familiarity patterns
  - silence and customer forgetting
  - service business presence
  # Secondary — business behavior with visibility mechanism
  - platform behavior change affecting small business reach
  - consumer trust and purchase decisions
  - referral and word-of-mouth patterns
  - small business marketing behavior
  - business communication patterns

avoid_categories:
  - large company M&A with no small business visibility angle
  - generic AI hype and model releases
  - earnings reports and investor news
  - macroeconomic forecasts without owner-facing mechanism
  - motivational content
  - opinion-only without data or observation
  - listicles without research
  - generic social media tips without mechanism
