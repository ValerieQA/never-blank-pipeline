[pytest]
# The repository root on sys.path for every invocation (#271 follow-up).
# tests/conftest.py imports `src` at collection time. `python3 -m pytest`
# happens to work because Python puts the working directory on sys.path;
# bare `pytest` does not, so two workflows died at conftest import with
# `ModuleNotFoundError: No module named 'src'` before running a single test
# — red on main for weeks, and read as a real failure by anything watching CI.
# Declared here rather than in each workflow so it holds however pytest is run.
pythonpath = .

markers =
    story9: Story #9 acceptance gate — contract, orchestration, and overwrite protection (Issue #30). Run with: python3 -m pytest -m story9
    story10: Story #10 acceptance gate — configuration replaceability, consumer behavior, and run isolation (Issue #43). Run with: python3 -m pytest -m story10
    story11: Story #11 acceptance gate — fresh normalized research, immutable lineage, and fail-closed routing (Issue #53). Run with: python3 -m pytest -m story11
    story12: Story #12 acceptance gate — real Decision Lens on the canonical path, immutable decision.json, and PROCEED-only continuation (Issue #61). Run with: python3 -m pytest -m story12
