lookback_hours: 72
max_candidates: 30
min_candidates: 5

signal_categories:
  - AI adoption
  - hiring changes
  - layoffs
  - pricing pressure
  - labor costs
  - consumer behavior
  - regulation
  - small business pressure
  - business trust
  - visibility
  - operational change
  - platform changes
  - technology adoption

avoid_categories:
  - generic AI hype
  - motivational content
  - opinion-only
  - listicles without data
  - generic marketing tips
