name: Test — Drive Upload Integration

on:
  workflow_dispatch:

jobs:
  test-drive:
    name: Test Drive Upload
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet google-auth google-api-python-client

      - name: Run Drive upload test
        env:
          NB_GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.NB_GOOGLE_SHEETS_CREDENTIALS_JSON }}
          NB_GOOGLE_DRIVE_PACKAGES_FOLDER_ID: ${{ secrets.NB_GOOGLE_DRIVE_PACKAGES_FOLDER_ID }}
        run: python scripts/test_drive_upload.py
