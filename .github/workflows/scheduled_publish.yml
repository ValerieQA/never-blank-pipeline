name: Scheduled Publisher

# Cron fires at 10:00/11:00 UTC Friday to cover EDT and EST.
#
# Monday was removed here by Issue #142: Monday is owned by
# monday_publish.yml, which runs the canonical pipeline. Leaving Monday on
# this legacy schedule would publish a second article that never passed the
# Decision Lens or editorial acceptance. Wednesday is likewise owned by
# wednesday_golden.yml; Friday remains on this legacy path until #144.
# The Python script performs the authoritative timezone check and exits cleanly
# if it is not within the configured publish window in America/New_York.

on:
  schedule:
    # #224: minute 17, not :00 — GitHub delays top-of-hour schedules the most,
    # and that delay silently cancelled Friday on 2026-08-28 and 2026-09-04.
    # The product hour is unchanged.
    - cron: "17 10 * * 5"   # 10:17 UTC = 06:17 ET (DST) / 05:17 ET (std)
    - cron: "17 11 * * 5"   # 11:17 UTC = 06:17 ET (std) / 07:17 ET (DST)

  workflow_dispatch:
    inputs:
      force:
        description: "Force run regardless of schedule (--force)"
        required: false
        type: boolean
        default: false
      check_only:
        description: "Only check whether publish is due (--check-only)"
        required: false
        type: boolean
        default: false

jobs:
  scheduled-publish:
    name: Scheduled Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet python-dotenv openai Pillow cloudinary PyYAML numpy google-auth google-api-python-client

      - name: Run scheduled publisher
        env:
          GITHUB_EVENT_NAME:                 ${{ github.event_name }}
          FIRED_CRON:                        ${{ github.event.schedule }}
          NB_OPENAI_API_KEY:                 ${{ secrets.NB_OPENAI_API_KEY }}
          NB_WIX_API_KEY:                    ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                    ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:              ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_ZERNIO_API_KEY:                 ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID:     ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_META_USER_TOKEN:                ${{ secrets.NB_META_USER_TOKEN }}
          NB_META_IG_USER_ID:                ${{ secrets.NB_META_IG_USER_ID }}
          NB_META_FB_PAGE_ID:                ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN:             ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_THREADS_ACCESS_TOKEN:           ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          NB_TELEGRAM_BOT_TOKEN:             ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID:            ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}
          NB_CLOUDINARY_CLOUD_NAME:          ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY:             ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET:          ${{ secrets.NB_CLOUDINARY_API_SECRET }}
          NB_GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.NB_GOOGLE_SHEETS_CREDENTIALS_JSON }}
          NB_GOOGLE_SHEET_ID:                ${{ secrets.NB_GOOGLE_SHEET_ID }}
        run: |
          # #224: the same product semantics Monday and Wednesday use — the
          # firing is identified by the cron that fired, and it may publish at
          # any later time on its intended local day. --force and --check-only
          # behave exactly as before.
          OUT=reports/scheduling/friday_scheduling_decision.json
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/scheduled_publish.py --force --decision-out "$OUT"
          elif [ "${{ inputs.check_only }}" = "true" ]; then
            python scripts/scheduled_publish.py --check-only \
              --event "$GITHUB_EVENT_NAME" --cron "$FIRED_CRON" --decision-out "$OUT"
          else
            python scripts/scheduled_publish.py \
              --event "$GITHUB_EVENT_NAME" --cron "$FIRED_CRON" --decision-out "$OUT"
          fi

      # #224: written on EVERY path, including a stale skip — deliberately
      # separate from the publish report, which only exists when work ran.
      - name: Preserve scheduling decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-scheduling-decision
          path: reports/scheduling/friday_scheduling_decision.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload scheduled publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-publish-report-${{ github.run_id }}
          path: reports/scheduled_publish_report.*
          retention-days: 7

      - name: Print step summary
        if: always()
        run: |
          echo "## Scheduled Publish Report" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/scheduled_publish_report.md ]; then
            cat reports/scheduled_publish_report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated (run skipped or publish not due)." >> $GITHUB_STEP_SUMMARY
          fi
