name: Copy Secrets to VG Group

on:
  workflow_dispatch:

jobs:
  copy-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Copy NB_ secrets to VG Group (skip LinkedIn)
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_PAT }}
          TARGET_REPO: ValerieQA/vg-group

          VG_ARTICLE_MODEL: ${{ secrets.NB_ARTICLE_MODEL }}
          VG_CLOUDINARY_API_KEY: ${{ secrets.NB_CLOUDINARY_API_KEY }}
          VG_CLOUDINARY_API_SECRET: ${{ secrets.NB_CLOUDINARY_API_SECRET }}
          VG_CLOUDINARY_CLOUD_NAME: ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          VG_DISCOVERY_MODEL: ${{ secrets.NB_DISCOVERY_MODEL }}
          VG_ENRICH_MODEL: ${{ secrets.NB_ENRICH_MODEL }}
          VG_GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.NB_GOOGLE_SHEETS_CREDENTIALS_JSON }}
          VG_GOOGLE_SHEET_ID: ${{ secrets.NB_GOOGLE_SHEET_ID }}
          VG_IMAGE_MODEL: ${{ secrets.NB_IMAGE_MODEL }}
          VG_META_FB_PAGE_ID: ${{ secrets.NB_META_FB_PAGE_ID }}
          VG_META_FB_PAGE_TOKEN: ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          VG_META_IG_USER_ID: ${{ secrets.NB_META_IG_USER_ID }}
          VG_META_USER_TOKEN: ${{ secrets.NB_META_USER_TOKEN }}
          VG_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}
          VG_OPENAI_CHAT_MODEL: ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          VG_OPENAI_EMBEDDING_MODEL: ${{ secrets.NB_OPENAI_EMBEDDING_MODEL }}
          VG_OPENAI_TEMPERATURE: ${{ secrets.NB_OPENAI_TEMPERATURE }}
          VG_RESEARCH_MAX_PUBLISH_SIGNALS_PER_RUN: ${{ secrets.NB_RESEARCH_MAX_PUBLISH_SIGNALS_PER_RUN }}
          VG_RESEARCH_PUBLISH_ENABLED: ${{ secrets.NB_RESEARCH_PUBLISH_ENABLED }}
          VG_RESEARCH_SHEET_ID: ${{ secrets.NB_RESEARCH_SHEET_ID }}
          VG_SCORING_MODEL: ${{ secrets.NB_SCORING_MODEL }}
          VG_SOCIAL_MODEL: ${{ secrets.NB_SOCIAL_MODEL }}
          VG_TELEGRAM_BOT_TOKEN: ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          VG_TELEGRAM_CHANNEL_ID: ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}
          VG_THREADS_ACCESS_TOKEN: ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          VG_WIX_API_KEY: ${{ secrets.NB_WIX_API_KEY }}
          VG_WIX_POST_OWNER_ID: ${{ secrets.NB_WIX_POST_OWNER_ID }}
          VG_WIX_SITE_ID: ${{ secrets.NB_WIX_SITE_ID }}
          VG_ZERNIO_API_KEY: ${{ secrets.NB_ZERNIO_API_KEY }}
          VG_ZERNIO_LINKEDIN_ACCOUNT_ID: ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}

        run: |
          set -e
          echo "Setting secrets in $TARGET_REPO..."

          secrets=(
            VG_ARTICLE_MODEL
            VG_CLOUDINARY_API_KEY
            VG_CLOUDINARY_API_SECRET
            VG_CLOUDINARY_CLOUD_NAME
            VG_DISCOVERY_MODEL
            VG_ENRICH_MODEL
            VG_GOOGLE_SHEETS_CREDENTIALS_JSON
            VG_GOOGLE_SHEET_ID
            VG_IMAGE_MODEL
            VG_META_FB_PAGE_ID
            VG_META_FB_PAGE_TOKEN
            VG_META_IG_USER_ID
            VG_META_USER_TOKEN
            VG_OPENAI_API_KEY
            VG_OPENAI_CHAT_MODEL
            VG_OPENAI_EMBEDDING_MODEL
            VG_OPENAI_TEMPERATURE
            VG_RESEARCH_MAX_PUBLISH_SIGNALS_PER_RUN
            VG_RESEARCH_PUBLISH_ENABLED
            VG_RESEARCH_SHEET_ID
            VG_SCORING_MODEL
            VG_SOCIAL_MODEL
            VG_TELEGRAM_BOT_TOKEN
            VG_TELEGRAM_CHANNEL_ID
            VG_THREADS_ACCESS_TOKEN
            VG_WIX_API_KEY
            VG_WIX_POST_OWNER_ID
            VG_WIX_SITE_ID
            VG_ZERNIO_API_KEY
            VG_ZERNIO_LINKEDIN_ACCOUNT_ID
          )

          for secret_name in "${secrets[@]}"; do
            value="${!secret_name}"
            if [ -n "$value" ]; then
              echo "$value" | gh secret set "$secret_name" --repo "$TARGET_REPO"
              echo "✓ $secret_name"
            else
              echo "⚠ $secret_name is empty — skipped"
            fi
          done

          echo ""
          echo "Done. LinkedIn secrets skipped — set manually:"
          echo "  VG_LINKEDIN_ACCESS_TOKEN"
          echo "  VG_LINKEDIN_AUTHOR_URN"
          echo "  VG_LINKEDIN_CLIENT_ID"
          echo "  VG_LINKEDIN_CLIENT_SECRET"
