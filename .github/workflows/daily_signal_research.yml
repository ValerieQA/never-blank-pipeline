name: Daily Signal Research

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 04:00 ET
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if no new signals"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  daily-research:
    name: Daily Signal Research
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openai PyYAML requests google-auth google-api-python-client Pillow cloudinary

      - name: Run research pipeline
        env:
          NB_OPENAI_API_KEY:                 ${{ secrets.NB_OPENAI_API_KEY }}
          # Per-stage model configuration — each stage can use a different model
          NB_DISCOVERY_MODEL:                ${{ secrets.NB_DISCOVERY_MODEL }}
          NB_SCORING_MODEL:                  ${{ secrets.NB_SCORING_MODEL }}
          NB_ENRICH_MODEL:                   ${{ secrets.NB_ENRICH_MODEL }}
          NB_ARTICLE_MODEL:                  ${{ secrets.NB_ARTICLE_MODEL }}
          NB_SOCIAL_MODEL:                   ${{ secrets.NB_SOCIAL_MODEL }}
          NB_IMAGE_MODEL:                    ${{ secrets.NB_IMAGE_MODEL }}
          # Legacy fallback — used only when stage-specific model secrets above are not set
          NB_OPENAI_CHAT_MODEL:              ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          NB_OPENAI_TEMPERATURE:             "0.3"
          NB_GOOGLE_SERVICE_ACCOUNT_JSON:    ${{ secrets.NB_GOOGLE_SERVICE_ACCOUNT_JSON }}
          NB_GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.NB_GOOGLE_SHEETS_CREDENTIALS_JSON }}
          NB_RESEARCH_SHEET_ID:              ${{ secrets.NB_RESEARCH_SHEET_ID }}
          NB_RESEARCH_SHEET_TAB:             "Signals"
          NB_RESEARCH_MAX_DAILY_COST_USD:    "2.00"
          NB_CLOUDINARY_CLOUD_NAME:          ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY:             ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET:          ${{ secrets.NB_CLOUDINARY_API_SECRET }}
          # Image controls
          NB_FORCE_REGENERATE_RESEARCH_IMAGES: ${{ secrets.NB_FORCE_REGENERATE_RESEARCH_IMAGES }}
          # Publishing guards
          NB_RESEARCH_PUBLISH_ENABLED:       ${{ secrets.NB_RESEARCH_PUBLISH_ENABLED }}
          NB_RESEARCH_MAX_PUBLISH_SIGNALS_PER_RUN: ${{ secrets.NB_RESEARCH_MAX_PUBLISH_SIGNALS_PER_RUN }}
          NB_PUBLISH_MODE:                   "live"
          NB_WIX_API_KEY:                    ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                    ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:              ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_WIX_BLOG_CATEGORY_ID:           ${{ secrets.NB_WIX_BLOG_CATEGORY_ID }}
          NB_WIX_BLOG_TAG_IDS:               ${{ secrets.NB_WIX_BLOG_TAG_IDS }}
          NB_ZERNIO_API_KEY:                 ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID:     ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_META_FB_PAGE_ID:                ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN:             ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_META_IG_USER_ID:                ${{ secrets.NB_META_IG_USER_ID }}
          NB_THREADS_ACCESS_TOKEN:           ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          NB_TELEGRAM_BOT_TOKEN:             ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID:            ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}
        run: python scripts/research/run_daily_research.py

      - name: Commit research data
        run: |
          git config user.name  "never-blank-bot"
          git config user.email "bot@never-blank.com"
          git add data/research/ data/memory/ reports/research_*.json reports/content_packages/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "research: daily signal update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.run_id }}
          path: |
            data/research/signals_active.jsonl
            data/research/selected_signals.jsonl
            data/research/image_library.json
            reports/research_*.json
            reports/content_packages/
          retention-days: 30

      - name: Print step summary
        if: always()
        run: |
          echo "## Daily Signal Research" >> $GITHUB_STEP_SUMMARY
          python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json, glob, sys
          sys.path.insert(0, ".")
          files = sorted(glob.glob("reports/research_*.json"))
          if not files:
              print("No report generated")
              sys.exit(0)

          d = json.load(open(files[-1]))
          print(f"## Never Blank Signal Research — {d.get('date','')}")
          print(f"")
          print(f"| Metric | Value |")
          print(f"|---|---|")
          print(f"| Candidates found | {d.get('candidates_found',0)} |")
          print(f"| New signals added | {d.get('new_signals_added',0)} |")
          print(f"| Selected for content | {d.get('selected_for_content',0)} |")
          print(f"| Duplicates skipped | {d.get('duplicates_skipped',0)} |")
          print(f"| Sheet sync | {d.get('sheet_sync','')} |")
          print(f"| Archive moved | {d.get('archived',0)} |")
          print(f"")

          sigs = d.get("top_signals", [])
          if sigs:
              print(f"### Top Signals")
              for i, s in enumerate(sigs, 1):
                  print(f"{i}. {s}")
              print("")

          # Publishing summary
          import os as _os
          pub_enabled = _os.environ.get("NB_RESEARCH_PUBLISH_ENABLED", "false").lower() == "true"
          pub_reports = d.get("publish_reports", [])
          if not pub_enabled:
              print("---")
              print("## Publishing Summary")
              print("")
              print("⏸️ Publishing disabled — set `NB_RESEARCH_PUBLISH_ENABLED=true` to publish live.")
              print("")
          elif pub_reports:
              print("---")
              print("## Publishing Summary")
              print("")
              for i, report in enumerate(pub_reports, 1):
                  headline = report.get("headline", "")
                  results  = report.get("results", {})
                  mode     = report.get("mode", "live")
                  print(f"### Signal #{i}: {headline[:70]}")
                  print(f"_Mode: {mode}_")
                  print("")
                  for platform, res in results.items():
                      status = res.get("status", "")
                      url = res.get("url", "")
                      err = res.get("error_message", "")
                      if status in ("PUBLISHED", "DRAFT_CREATED"):
                          url_part = f" — [{url}]({url})" if url else ""
                          print(f"- ✅ **{platform.title()}** {status}{url_part}")
                      elif status == "published_url_unavailable":
                          print(f"- ✅ **{platform.title()}** published — URL unavailable (check platform directly)")
                      elif status == "SKIPPED":
                          print(f"- ⏭️ **{platform.title()}** skipped — {err}")
                      else:
                          print(f"- ❌ **{platform.title()}** FAILED — {err}")
                  print(f"")
                  ig_sig   = report.get("instagram_signature", False)
                  tg_sig   = report.get("telegram_signature", False)
                  wix_cov  = report.get("wix_cover_image_attached", False)
                  gen_file = report.get("generated_file", "")
                  dv       = report.get("image_design_version", "—")
                  hook     = report.get("image_hook_text", "—")
                  family   = report.get("image_visual_family", "—")
                  method   = report.get("image_method", "—")
                  print(f"**Image:** design_version={dv} | visual={family} | method={method}")
                  print(f"**Hook text:** {hook}")
                  print(f"- Instagram signature: {'✅ included' if ig_sig else '❌ missing'}")
                  print(f"- Telegram signature: {'✅ included' if tg_sig else '❌ missing'}")
                  print(f"- Wix cover image: {'✅ attached' if wix_cov else '⚠️ not attached (see Wix Media Manager)'}")
                  if gen_file:
                      print(f"- Generated content: `{gen_file}`")
                  # Platform image sizes
                  pimgs = report.get("platform_images", {})
                  if pimgs:
                      print("")
                      print("**Platform images:**")
                      for p, info in pimgs.items():
                          url2 = info.get("url", "")
                          sz   = info.get("size", "")
                          icon = "✅" if url2 else "❌"
                          print(f"- {icon} {p} ({sz}): {url2[:70] if url2 else 'no URL'}")
                  print("")

          # Content packages from per-signal JSON files
          pkg_files = sorted(glob.glob("reports/content_packages/*.json"))
          if pkg_files:
              print("---")
              print("## Content Package Preview")
              platforms = ["blog", "linkedin", "facebook", "instagram", "threads", "stories"]
              for pi, pkg_file in enumerate(pkg_files, 1):
                  try:
                      pkg = json.load(open(pkg_file))
                      headline = pkg.get("HEADLINE", "")
                      content  = pkg.get("content", {})
                      images   = pkg.get("images", {})
                      pimgs    = images.get("platform_images", {})

                      print(f"")
                      print(f"### Signal #{pi}: {headline[:70]}")
                      print("")

                      for platform in platforms:
                          c   = content.get(platform, {})
                          img = pimgs.get(platform, {})
                          reused = "yes" if img.get("reused") else "no"
                          path   = img.get("path", "—")

                          if platform == "blog":
                              print(f"**Blog**")
                              print(f"- Headline: {c.get('headline','—')}")
                              print(f"- Angle: {c.get('angle','—')}")
                          elif platform == "linkedin":
                              print(f"**LinkedIn**")
                              print(f"- Headline: {c.get('headline','—')}")
                              print(f"- Angle: {c.get('angle','—')}")
                          elif platform == "facebook":
                              print(f"**Facebook**")
                              print(f"- Headline: {c.get('headline','—')}")
                              print(f"- Angle: {c.get('angle','—')}")
                          elif platform == "instagram":
                              print(f"**Instagram**")
                              print(f"- Headline: {c.get('headline','—')}")
                              print(f"- Angle: {c.get('angle','—')}")
                          elif platform == "threads":
                              print(f"**Threads**")
                              print(f"- Thread hook: {c.get('thread_hook','—')}")
                              print(f"- Angle: {c.get('angle','—')}")
                          elif platform == "stories":
                              print(f"**Stories**")
                              print(f"- Story question: {c.get('story_question','—')}")
                              print(f"- Angle: {c.get('angle','—')}")

                          print(f"- Image: {path[:80] if path else '—'}")
                          print(f"- Image reused: {reused}")
                          print("")

                      print(f"**Image summary**")
                      print(f"- Reuse rate: {images.get('reuse_rate','—')}")
                      print(f"- New images generated: {images.get('new_images',0)}")
                      print(f"- Images reused: {images.get('reused_images',0)}")
                      print("")
                  except Exception as e:
                      print(f"Error reading package {pkg_file}: {e}")
          EOF
