# Never Blank MVP 1 — the historical research lane, on demand.
#
# A temporary operational release so Never Blank has something demonstrably
# working for prospective clients while the Golden Engine is completed. It is
# not a replacement for the Golden Engine and shares no code with it: this is
# the July lane — a signal the system discovered, the package Stage 10
# prepared, and Stage 11, which generates the six final texts and publishes
# them. Forensics and the Versant lineage: #393.
#
# **This drives the historical behaviour, not a reconstruction of it.** Stage 11
# has always produced the prose at publication time — July's own
# `publish_packages.py` imported `generate_article` — so a live run generates.
# A "publish the already-generated package" mode was considered and **declined**
# (owner, 2026-10-07): it would be a new capability, and this lane is being
# restored, not redesigned.
#
# What was broken and is now fixed is one seam: #100/#101 moved the Wix and
# LinkedIn adapters to a frozen canonical package and moved their target
# identity into it, and nothing adapted the lane already calling them. #395
# restored that caller. `release_scope.py` is untouched and still answers what
# an automatic Release 1 run may do; this is an explicit manual non-R1 caller,
# which is the case that module was written to permit.
#
# **Off until somebody turns it on, and inspecting until somebody asks for
# live.** `NB_MVP1_ENABLED` stops a dispatch from running at all; `mode`
# defaults to `inspect`, which calls nothing.
#
# There is deliberately **no dry-run mode**. Stage 11 generates before it
# touches a publisher, so a rehearsal through it would cost nine model calls
# and post nothing — the worst of both. `inspect` is free because it never
# reaches the stage.
name: Never Blank MVP 1

on:
  # Tuesday and Thursday, one cycle each (owner, 2026-10-08). 08:17 UTC is the
  # 04:17 ET slot #232 established, and it deliberately avoids
  # `visibility_publish.yml`'s 07:00 UTC on these same two days.
  #
  # The minute is :17 for the reason #224 found: a runner that fires late must
  # still be inside its own local day, and the hour boundary is where that
  # tolerance was being lost.
  schedule:
    - cron: "17 8 * * 2"   # Tuesday  08:17 UTC = 04:17 ET
    - cron: "17 8 * * 4"   # Thursday 08:17 UTC = 04:17 ET
  workflow_dispatch:
    inputs:
      signal_id:
        description: "A signal the system already discovered, with a prepared package."
        required: false
        default: a71d52f27d921529
        type: string
      mode:
        description: "inspect: check the inputs, call nothing. live: generate and publish."
        required: false
        default: inspect
        type: choice
        options: [inspect, live]
      channels:
        description: "Comma-separated destinations. Default: MVP 1's five."
        required: false
        # Owner decision 2026-10-07: Threads is out of MVP 1 — not because it
        # failed, but because #393 found no record of it ever having published.
        # The publisher stays in the repository and stays drivable when asked.
        default: wix,linkedin,facebook,instagram,telegram
        type: string

jobs:
  mvp1:
    name: "MVP 1 — ${{ inputs.mode || (github.event_name == 'schedule' && 'live' || 'inspect') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Resolved once, because `inputs` is empty on a schedule and a step that
    # read it directly would quietly fall back to `inspect` and publish
    # nothing. A dispatch keeps every default it had; only the scheduled event
    # is new here.
    #
    # `auto` is not a new selection policy: it is the queue order the lane
    # already walks, restricted to signals with a prepared package that the
    # publication authority has not spent. A scheduled day cannot name a
    # signal, and naming one in the cron would republish it forever.
    env:
      MVP1_MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'live' || 'inspect') }}
      MVP1_SIGNAL: ${{ inputs.signal_id || 'auto' }}
      MVP1_CHANNELS: ${{ inputs.channels || 'wix,linkedin,facebook,instagram,telegram' }}
    permissions:
      # Live run 37704053905 generated all six texts and published nothing:
      # read-only denied `GitSharedClaim`'s `git push origin HEAD:main`, so
      # `acquire()` could not establish idempotency authority and every
      # destination fail-closed with `idempotency_authority_unavailable`.
      # A claim that cannot reach the remote is not authority, and that push
      # is a prerequisite of publication — not bookkeeping after it.
      # Same grant as `daily_signal_research.yml` and `wednesday_golden.yml`.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Is MVP 1 enabled?
        id: gate
        env:
          ENABLED: ${{ vars.NB_MVP1_ENABLED }}
        run: |
          # Unset is "nobody enabled this", not "enabled with a default" — the
          # same posture canonical_shadow.yml takes, and for the same reason: a
          # live run of this lane publishes to five real surfaces.
          if [ "${ENABLED}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "NB_MVP1_ENABLED is not 'true' — nothing was run."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet -r requirements.txt

      # ── inspect: free, and it never reaches Stage 11
      #
      # It answers one question — could this signal be published — by checking
      # that the signal is in the discovered store, that its package exists and
      # carries text for every requested destination, and that the package
      # already holds a hosted image. No credential is given to this step.
      - name: "Inspect the signal and its package"
        if: steps.gate.outputs.run == 'true' && env.MVP1_MODE == 'inspect'
        env:
          PYTHONPATH: .
          SIGNAL_ID: ${{ env.MVP1_SIGNAL }}
          CHANNELS: ${{ env.MVP1_CHANNELS }}
        run: |
          set -euo pipefail
          case "${SIGNAL_ID}" in (*[!a-z0-9]*|"") echo "ERROR: signal_id must be lowercase hex; got '${SIGNAL_ID}'"; exit 1 ;; esac
          case "${CHANNELS}" in (*[!a-z,]*|"") echo "ERROR: channels must be lowercase names and commas; got '${CHANNELS}'"; exit 1 ;; esac
          python3 scripts/mvp1_publish_signal.py \
            --signal-id "${SIGNAL_ID}" --channels "${CHANNELS}" --mode inspect

      # ── live: Stage 11 — generate the six texts, then publish
      #
      # `NB_RESEARCH_PUBLISH_ENABLED` is the stage's own switch and is set here,
      # for this step only. It does not reach Daily Signal Research, which reads
      # its own from a secret: that job still generates, packages and publishes
      # nothing.
      #
      # The image is the one the package already carries, hosted. Stage 11
      # reuses a hosted image rather than regenerating it, so no image call is
      # expected — `NB_FORCE_REGENERATE_RESEARCH_IMAGES` is deliberately not
      # passed.
      #
      # Idempotency is the publishers' own: `PublicationGuard` records an intent
      # before each destination's call and a marker after it, keyed by
      # (client, destination, source signal) with no run id and no digest, so a
      # destination that already published is refused on a retry and a partial
      # failure cannot repost to the ones that succeeded.
      - name: "Live: generate and publish"
        id: publish
        if: steps.gate.outputs.run == 'true' && env.MVP1_MODE == 'live'
        env:
          PYTHONPATH: .
          SIGNAL_ID: ${{ env.MVP1_SIGNAL }}
          CHANNELS: ${{ env.MVP1_CHANNELS }}
          NB_RESEARCH_PUBLISH_ENABLED: "true"
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}
          NB_OPENAI_CHAT_MODEL: ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          # #213's convention, and the defect live run 37689111181 paid for.
          # Every stage resolved through `NB_OPENAI_CHAT_MODEL` because none of
          # the stage secrets were passed, and the provider rejected that value
          # with HTTP 400 `invalid model ID` on the first call — the identical
          # failure `wednesday_golden.yml` records for run 33281894748 (#236).
          # Same five secrets and same spelling as Wednesday and the daily
          # research workflow this lane restores; not a new routing scheme.
          #
          # Stage 11 reaches only enrich, article and social; discovery and
          # scoring belong to the research stages this lane does not run, and
          # are passed to keep the set identical to the established one rather
          # than to satisfy a call. `NB_IMAGE_MODEL` is deliberately still not
          # passed: the package's image is reused hosted, so nothing draws one.
          NB_DISCOVERY_MODEL: ${{ secrets.NB_DISCOVERY_MODEL }}
          NB_SCORING_MODEL: ${{ secrets.NB_SCORING_MODEL }}
          NB_ENRICH_MODEL: ${{ secrets.NB_ENRICH_MODEL }}
          NB_ARTICLE_MODEL: ${{ secrets.NB_ARTICLE_MODEL }}
          NB_SOCIAL_MODEL: ${{ secrets.NB_SOCIAL_MODEL }}
          NB_WIX_API_KEY: ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID: ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID: ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_WIX_SITE_BASE_URL: ${{ secrets.NB_WIX_SITE_BASE_URL }}
          NB_WIX_BLOG_CATEGORY_ID: ${{ secrets.NB_WIX_BLOG_CATEGORY_ID }}
          NB_WIX_BLOG_TAG_IDS: ${{ secrets.NB_WIX_BLOG_TAG_IDS }}
          NB_ZERNIO_API_KEY: ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID: ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_META_FB_PAGE_ID: ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN: ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_META_IG_USER_ID: ${{ secrets.NB_META_IG_USER_ID }}
          NB_TELEGRAM_BOT_TOKEN: ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID: ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}
        run: |
          set -euo pipefail
          case "${SIGNAL_ID}" in (*[!a-z0-9]*|"") echo "ERROR: signal_id must be lowercase hex; got '${SIGNAL_ID}'"; exit 1 ;; esac
          case "${CHANNELS}" in (*[!a-z,]*|"") echo "ERROR: channels must be lowercase names and commas; got '${CHANNELS}'"; exit 1 ;; esac
          python3 scripts/mvp1_publish_signal.py \
            --signal-id "${SIGNAL_ID}" --channels "${CHANNELS}" --mode live

      # Evidence first, and under `always()` — the whole point of #287. The
      # marker store is written inside the publishing step, intent before each
      # irreversible call and marker immediately after that destination
      # succeeds, but `record_marker` writes locally and never pushes: on a
      # hosted runner that tree dies with the job. Run 37715852447 is what that
      # costs — four surfaces published and no durable record of any of them,
      # because this lane was the one publishing workflow that never called the
      # script four others already do.
      #
      # It must not be guarded by `success()`: a run whose second destination
      # fails commits nothing, and the marker of the destination that DID
      # publish is exactly what has to survive that failure.
      - name: "Live: persist publication markers"
        if: always() && steps.gate.outputs.run == 'true' && env.MVP1_MODE == 'live'
        env:
          # The script refuses to leave durable evidence of a rehearsal. This
          # step is already live-only; the second statement of it is the
          # script's own, and they must agree rather than one trusting the other.
          DRY_RUN: ${{ env.MVP1_MODE != 'live' }}
        run: bash scripts/ci/persist_publication_markers.sh

      # Bookkeeping second, and only on `success()` — which now means
      # something, because the entry script no longer returns 0 for a cycle it
      # did not settle. Consuming the signal and appending to the published
      # index together declare *the cycle* complete, so a partial run must not
      # reach them: its markers are already preserved above, and the signal
      # stays eligible.
      #
      # The two files move together on purpose. `append_published_entry` is a
      # plain append with no duplicate guard, so committing the index for a
      # cycle whose signal is still unconsumed would give a later complete run
      # a second row for the same signal.
      #
      # Same sequence as `wednesday_golden.yml`'s "Mark signal as published".
      - name: "Live: mark the cycle complete"
        if: success() && steps.gate.outputs.run == 'true' && env.MVP1_MODE == 'live' && steps.publish.outputs.signal_id != ''
        env:
          # The *resolved* id, never the literal `auto` a scheduled day passes
          # in. Same output name and same `!= ''` guard as
          # `wednesday_golden.yml`'s "Mark signal as published".
          SIGNAL_ID: ${{ steps.publish.outputs.signal_id }}
        run: |
          set -euo pipefail
          case "${SIGNAL_ID}" in (*[!a-z0-9]*|"") echo "ERROR: signal_id must be lowercase hex"; exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          echo "${SIGNAL_ID}" >> data/research/published_signal_ids.txt
          git add data/research/published_signal_ids.txt
          git add strategy/published_content_index.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "MVP 1: ${SIGNAL_ID} published [skip ci]"
          git push

      # Always, and last: a partial cycle is the one worth reading. The
      # generated package is what Stage 11 wrote — the six texts as published —
      # and it is the evidence a reviewer needs when one destination failed.
      - name: Preserve the MVP 1 cycle
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "nb-mvp1-${{ env.MVP1_MODE }}-${{ github.run_id }}"
          path: |
            reports/content_packages/${{ inputs.signal_id }}_generated.json
            reports/content_packages/${{ inputs.signal_id }}.json
          if-no-files-found: warn
          retention-days: 90
