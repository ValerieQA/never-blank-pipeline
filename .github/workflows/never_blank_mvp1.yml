# Never Blank MVP 1 — the proven July production lane, on demand.
#
# A temporary operational release so Never Blank has something demonstrably
# working for prospective clients while the Golden Engine is completed. It is
# **not** a replacement for the Golden Engine and shares no code with it: this
# lane is `scripts/generate.py` → `data/drafts/latest/` → `scripts/publish.py`,
# the sequence `scripts/scheduled_publish.py` has always driven, and the
# publishers under `src/publishing/`. Nothing here imports
# `src/editorial_core/`.
#
# Why a new workflow and no new code: every component of that lane is still on
# `main` and unmodified — `generate.py` was last changed 2026-07-21, which is
# the July behaviour itself. What was removed was the lane's *trigger*,
# `scheduled_publish.yml`, deleted on 2026-10-04 (#326/#380). This restores a
# trigger and nothing else. Forensics: #393.
#
# On the R1 allowlist: this lane does not import `src/publishing/release_scope.py`
# and does not need to. That module states the reason itself — it imports no
# publisher precisely so a publisher class stays "fully usable by a manual or
# non-R1 caller, without becoming reachable from a scheduled run". MVP 1 is
# that manual caller. R1's scope is untouched.
#
# **Off until somebody turns it on, and dry until somebody asks for live.**
# Two independent conditions, for two different kinds of accident: the
# `NB_MVP1_ENABLED` repository variable stops a dispatch from running at all,
# and `mode` defaults to `dry`, which makes no paid call and publishes nothing.
name: Never Blank MVP 1

on:
  # No schedule. A recurring lane is a separate decision, and this one exists
  # to be shown to a client on purpose rather than to run unattended.
  workflow_dispatch:
    inputs:
      mode:
        description: "dry: validate the whole lane, no paid call, no publication. live: generate and publish."
        required: false
        default: dry
        type: choice
        options: [dry, live]
      channels:
        description: "Comma-separated destinations. Default: all six."
        required: false
        default: wix,linkedin,facebook,instagram,threads,telegram
        type: string

jobs:
  mvp1:
    name: "MVP 1 — ${{ inputs.mode || 'dry' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Is MVP 1 enabled?
        id: gate
        env:
          ENABLED: ${{ vars.NB_MVP1_ENABLED }}
        run: |
          # Unset is "nobody enabled this", not "enabled with a default" — the
          # same posture canonical_shadow.yml takes, and for the same reason:
          # a live run of this lane publishes to six real surfaces.
          if [ "${ENABLED}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "NB_MVP1_ENABLED is not 'true' — nothing was run."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet -r requirements.txt

      # ── dry: the whole lane, validated, with nothing paid and nothing posted
      #
      # `generate.py --dry` resolves the topic and the brief and stops before
      # the model. `generate_image.py --dry-run` checks the image pipeline's
      # configuration without calling DALL·E or Cloudinary. `publish.py
      # --dry-run` validates the payload of every requested destination without
      # an API call — which is what makes all six independently observable
      # before a single cent is spent.
      - name: "Dry: validate the lane"
        if: steps.gate.outputs.run == 'true' && (inputs.mode || 'dry') == 'dry'
        env:
          CHANNELS: ${{ inputs.channels }}
        run: |
          set -euo pipefail
          case "${CHANNELS}" in
            (*[!a-z,]*|"") echo "ERROR: channels must be lowercase names and commas; got '${CHANNELS}'"; exit 1 ;;
          esac
          python3 scripts/generate.py --dry
          python3 scripts/generate_image.py --dry-run
          # A draft from an earlier generate run is validated when one exists;
          # on a clean checkout there is none, and that is not a failure of the
          # lane. Reported either way rather than hidden.
          if [ -f data/drafts/latest/metadata.json ] || [ -f data/drafts/latest/final/metadata.json ]; then
            python3 scripts/publish.py --dry-run --channels "${CHANNELS}"
          else
            echo "No draft in data/drafts/latest/ — payload validation skipped."
            echo "Run mode=live, or generate a draft first, to exercise the publishers."
          fi

      # ── live: the proven sequence, verbatim, through its own script
      #
      # `--force` runs regardless of config/schedule.yaml, which still says
      # Friday. The script itself owns the order and the per-destination
      # isolation: Wix first, then linkedin/facebook/instagram/threads each
      # independently with abort_on_fail=False, then telegram only if Wix
      # returned 0 — because telegram needs the article URL.
      #
      # Idempotency is the publishers' own: `PublicationGuard` records an
      # intent before each destination's call and a marker after it, keyed by
      # (client, destination, source signal) with no run id and no digest. A
      # destination that already published is refused on a retry, so a partial
      # failure cannot repost to the ones that succeeded.
      - name: "Live: generate and publish"
        if: steps.gate.outputs.run == 'true' && (inputs.mode || 'dry') == 'live'
        env:
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}
          NB_OPENAI_CHAT_MODEL: ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          NB_WIX_API_KEY: ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID: ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID: ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_WIX_SITE_BASE_URL: ${{ secrets.NB_WIX_SITE_BASE_URL }}
          NB_ZERNIO_API_KEY: ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID: ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_META_FB_PAGE_ID: ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN: ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_META_IG_USER_ID: ${{ secrets.NB_META_IG_USER_ID }}
          NB_THREADS_ACCESS_TOKEN: ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          NB_TELEGRAM_BOT_TOKEN: ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID: ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}
          NB_CLOUDINARY_CLOUD_NAME: ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY: ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET: ${{ secrets.NB_CLOUDINARY_API_SECRET }}
        run: python3 scripts/scheduled_publish.py --force

      # Always, and after the run: a failed or partial cycle is the one worth
      # reading. `scheduled_publish_report.{json,md}` carries one record per
      # step with its return code, which is where each destination's outcome is
      # independently visible; the draft is what was actually generated.
      - name: Preserve the MVP 1 cycle
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "nb-mvp1-${{ inputs.mode || 'dry' }}-${{ github.run_id }}"
          path: |
            reports/scheduled_publish_report.json
            reports/scheduled_publish_report.md
            data/drafts/latest/
          if-no-files-found: warn
          retention-days: 90
