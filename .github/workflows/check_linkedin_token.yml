name: Check LinkedIn Token
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Introspect token
        env:
          NB_LINKEDIN_ACCESS_TOKEN:  ${{ secrets.NB_LINKEDIN_ACCESS_TOKEN }}
          NB_LINKEDIN_CLIENT_ID:     ${{ secrets.NB_LINKEDIN_CLIENT_ID }}
          NB_LINKEDIN_CLIENT_SECRET: ${{ secrets.NB_LINKEDIN_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.parse, json, base64, datetime

          token   = os.environ["NB_LINKEDIN_ACCESS_TOKEN"]
          cid     = os.environ["NB_LINKEDIN_CLIENT_ID"]
          csecret = os.environ["NB_LINKEDIN_CLIENT_SECRET"]

          basic = base64.b64encode(f"{cid}:{csecret}".encode()).decode()
          body  = urllib.parse.urlencode({"token": token, "client_id": cid, "client_secret": csecret}).encode()
          req   = urllib.request.Request(
              "https://www.linkedin.com/oauth/v2/introspectToken",
              data=body,
              headers={"Content-Type": "application/x-www-form-urlencoded",
                       "Authorization": f"Basic {basic}"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              resp = json.loads(r.read())

          active   = resp.get("active", False)
          scopes   = resp.get("scope", "")
          exp      = resp.get("expires_at", 0)
          sub      = resp.get("sub", "")
          exp_dt   = datetime.datetime.utcfromtimestamp(exp).strftime("%Y-%m-%d %H:%M UTC") if exp else "unknown"

          print(f"active       : {active}")
          print(f"scopes       : {scopes}")
          print(f"expires_at   : {exp_dt}")
          print(f"sub          : {sub}")

          if not active:
              print("RESULT: ✗ FAIL — token inactive or expired")
              raise SystemExit(1)
          if "w_member_social" not in scopes:
              print("RESULT: ✗ FAIL — w_member_social scope missing")
              raise SystemExit(1)
          print("RESULT: ✓ PASS — token active, w_member_social present")
          PY
