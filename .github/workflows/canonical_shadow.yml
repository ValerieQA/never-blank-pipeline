# Canonical shadow run — the whole engine, S-00 → S-14, publishing nothing.
#
# SL-7 (issue #308). It exists to measure what the canonical chain actually
# costs on real signals *before* anything is optimized, which is why its own
# Scope says "Optimization of any kind" is out: a measurement taken after a
# change is a measurement of the change.
#
# Shadow is structural here, not a flag inside a publisher. S-14 runs in the
# half that has no external effect — it packages what can be packaged and
# fingerprints every accepted text — and `src/editorial_core/publication.py`
# names no publisher, no image pipeline and no marker store, so "no publish
# call" is checkable rather than promised (tests/test_308_shadow_publication.py
# asserts it against the module's own source).
#
# **It is off until somebody turns it on.** The run makes real model calls —
# that is the measurement — so a schedule alone must not start spending. The
# job is gated on the `CANONICAL_SHADOW_ENABLED` repository variable, and an
# unset variable means "nobody has enabled this", which is a different
# statement from "run it". The same posture `knowledge_maintenance.yml` takes
# toward its warning window, and for the same reason.
name: Canonical Shadow Run

on:
  schedule:
    # 11:00 UTC = 07:00 ET. Well away from the 04:17 ET publishing window, so a
    # shadow measurement never contends with a production run for a runner.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      signal_id:
        description: "The intake record to run. Left empty, the production selector chooses one."
        required: false
        type: string
      role:
        description: "A role the business strategy configuration declares"
        required: false
        default: never-blank-monday-documented-case
        type: string
      # A diagnostic run asks one question and should not pay for the whole
      # measurement to ask it. #308's run 1 spent 6 of 60 calls and stopped at
      # S-04; reading why needs the stage, not the budget.
      #
      # The default is the canonical ceiling, so a dispatch that leaves this
      # alone behaves exactly as every dispatch did before. A **scheduled** run
      # carries no inputs at all, and the step below passes no flag in that
      # case, so the acceptance path keeps taking its default from the script —
      # there is no second place where the number lives.
      #
      # `type: string` because `workflow_dispatch` has no number type. The
      # value is validated as digits in the step and as a range by
      # `RunCallBudget`, which owns what a legal ceiling is.
      call_budget:
        description: "Maximum model calls for this run (1…62). Default: the canonical ceiling."
        required: false
        default: "62"
        type: string

# The run writes its fingerprints and its summary into the durable ledger and
# commits them. It publishes nothing, so it needs no publishing credential.
permissions:
  contents: write

concurrency:
  # One shadow run at a time: two would contend for the create-once ledger
  # paths, and the second would be refused rather than measured.
  group: canonical-shadow
  cancel-in-progress: false

jobs:
  shadow:
    name: S-00 to S-14, no publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is the shadow run enabled?
        id: gate
        env:
          ENABLED: ${{ vars.CANONICAL_SHADOW_ENABLED }}
        run: |
          # Unset is "not enabled", not "enabled with a default". The run costs
          # money, so the only value that starts it is an explicit one.
          if [ "${ENABLED}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "CANONICAL_SHADOW_ENABLED is not 'true' — nothing was run."
            echo "Set the repository variable to enable the measurement."
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet -r requirements.txt

      # A dispatched run names its signal. A scheduled one has to choose, and
      # it chooses with the production selector — the same
      # `select_eligible_signal.py` the streams use, with its own exit codes:
      # 0 selected, 3 every candidate was evaluated and none was eligible
      # (a clean "nothing to measure today"), 4 a judgment failed.
      - name: Select a signal
        id: signal
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONPATH: .
          NB_GOLDEN_ENGINE_MODEL: ${{ secrets.NB_GOLDEN_ENGINE_MODEL }}
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}
          DISPATCHED: ${{ inputs.signal_id }}
          ROLE: ${{ inputs.role || 'never-blank-monday-documented-case' }}
        run: |
          if [ -n "${DISPATCHED}" ]; then
            echo "signal_id=${DISPATCHED}" >> "$GITHUB_OUTPUT"
            echo "dispatched: ${DISPATCHED}"
            exit 0
          fi
          set +e
          python3 scripts/streams/select_eligible_signal.py \
            --editorial-role "${ROLE}" | tee selection.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -eq 3 ]; then
            echo "signal_id=" >> "$GITHUB_OUTPUT"
            echo "every candidate was evaluated and none was eligible — "
            echo "nothing to measure today, and that is a clean result."
            exit 0
          fi
          if [ "${status}" -ne 0 ]; then
            echo "the selector failed (exit ${status}); failing visibly."
            exit "${status}"
          fi
          chosen=$(grep -oE '^selected=.*$' selection.log | tail -1 | cut -d= -f2)
          echo "signal_id=${chosen}" >> "$GITHUB_OUTPUT"

      # Before the run, not after it: the run commits its own records through
      # the canonical §3.1 mechanism, so the identity has to exist by then.
      - name: Configure the committer
        if: steps.gate.outputs.run == 'true' && steps.signal.outputs.signal_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run the canonical chain in shadow
        if: steps.gate.outputs.run == 'true' && steps.signal.outputs.signal_id != ''
        env:
          PYTHONPATH: .
          # The one variable that decides the model for all ten Golden Engine
          # transports. It has no fallback: an unconfigured engine refuses to
          # start rather than measuring whatever the legacy pipeline is set to.
          NB_GOLDEN_ENGINE_MODEL: ${{ secrets.NB_GOLDEN_ENGINE_MODEL }}
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}
          NB_EXA_API_KEY: ${{ secrets.NB_EXA_API_KEY }}
          CALL_BUDGET: ${{ inputs.call_budget }}
        run: |
          # --commit: the run itself commits the durable E-16 records S-14
          # wrote and then its summary, each over its own exact paths, and the
          # summary states the status of the first (Step 3 §3.1, §3.3). There
          # is deliberately no `git add data/editorial` step after this one:
          # staging the ledger directory would commit whatever else happened to
          # be untracked there — another run's records, or a publication marker
          # its own step withheld — and would report a status about them under
          # this run's name.
          # The ceiling, when this run was dispatched with one. Read from an
          # environment variable and checked as digits before it is used:
          # interpolating a dispatch input straight into a shell is how an
          # input becomes a command, and the repository already guards its
          # other dispatch inputs this way.
          #
          # Empty means a scheduled run, which carries no inputs — no flag is
          # passed and the script applies its own default. An out-of-range
          # number is left to `RunCallBudget`, which refuses it and fails the
          # run rather than falling back to a ceiling nobody asked for.
          BUDGET=""
          if [ -n "${CALL_BUDGET}" ]; then
            case "${CALL_BUDGET}" in
              (*[!0-9]*|"")
                echo "ERROR: call_budget must be digits; got '${CALL_BUDGET}'"
                exit 1
                ;;
            esac
            BUDGET="--call-budget ${CALL_BUDGET}"
          fi
          python3 scripts/run_canonical_shadow.py \
            --signal-id "${{ steps.signal.outputs.signal_id }}" \
            --role "${{ inputs.role || 'never-blank-monday-documented-case' }}" \
            ${BUDGET} \
            --commit

      # Acceptance run 1 (37460768845) was non-qualifying twice over: it
      # stopped at S-04, and its evidence was destroyed with the runner. This
      # workflow uploaded nothing, so the run namespace and the early-stop
      # record existed only on the runner's disk — and four of #308's
      # acceptance items are statements about the trace, the manifest and the
      # StageRecords, which no amount of re-reading the committed summary can
      # answer. Step 3 §3.2 already expects the run namespace to be an
      # uploaded Actions artifact with explicit retention; Monday and Wednesday
      # implement it and the shadow path did not.
      #
      # Two directories, and both are **untracked in a clean checkout** — the
      # run's own summary records `tracked_worktree_clean: true` — so what is
      # uploaded can only be what this run produced. That is why the paths need
      # no `run_id`: the id is generated inside the process and is deliberately
      # never reconstructed from a log or a marker file.
      #
      #   reports/editorial_runs/      the run namespace: manifest.json, the
      #                               entity and trace indexes, every
      #                               StageRecord, and each entity version
      #                               (§2.2). This is where PASS_THROUGH_MARKER
      #                               counts, ID+version lineage,
      #                               `request_digest` coverage and the call
      #                               trace are readable.
      #   data/editorial/early_stops/  why the run stopped before S-14, with the
      #                               stage, the state code and the rationale
      #                               §3.3 keeps out of the public summary.
      #
      # `always()`: an early stop and a failed run are the evidence that
      # matters most, and #308 cannot diagnose either from a green summary. A
      # run that reached S-14 writes no early-stop record at all, so
      # `if-no-files-found: warn` — never `error`, which would turn a
      # legitimate early stop, or a legitimate complete run, into a failed
      # workflow.
      #
      # It publishes nothing, writes no publication marker and touches no
      # bookkeeping: it is one `upload-artifact` with no `run` script, no
      # `env`, and no secret. Placed last, after the run and after the run's
      # own commits, so it cannot fail in front of them.
      - name: Preserve canonical run evidence
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "canonical-shadow-evidence-${{ steps.signal.outputs.signal_id || github.run_id }}"
          path: |
            reports/editorial_runs/
            data/editorial/early_stops/
          if-no-files-found: warn
          retention-days: 90
