name: Wednesday — Never Blank Golden

# Independent Never Blank product stream (Issue #143). The generic Engine
# resolves the explicit role; this workflow owns only Wednesday runtime.

on:
  schedule:
    # #232: 04:17 America/New_York, matching Monday and Friday. The minute
    # leaves the top of the hour (where GitHub delays schedules the most) and
    # the earlier hour buys more of the local day for #226's same-day recovery.
    - cron: "17 8 * * 3"   # 08:17 UTC = 04:17 ET (EDT)
    - cron: "17 9 * * 3"   # 09:17 UTC = 04:17 ET (EST)
  workflow_dispatch:
    inputs:
      signal_id:
        description: "SIGNAL_ID — filters what Wednesday's own July research discovers; leave empty for a normal automatic run"
        required: false
        default: ""
        type: string
      source_run_id:
        description: "Republish an existing completed generation run via --from-package (requires signal_id; leave empty for a normal automatic run)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Generate and validate without publishing"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: never-blank-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wednesday-golden:
    name: Wednesday — Never Blank Golden
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # #224: bound to the cron that actually fired rather than to the runner's
      # clock, so a firing delayed by hours still knows which Wednesday it
      # belongs to and still publishes — for as long as it is that Wednesday in
      # America/New_York. Once the local day has advanced it is stale.
      - name: Wednesday publish window
        id: window
        run: |
          if python scripts/streams/due_check.py \
               --day wednesday --time "$WEDNESDAY_TIME" --timezone "$WEDNESDAY_TZ" \
               --event "$GITHUB_EVENT_NAME" --cron "$FIRED_CRON" \
               --role "$WEDNESDAY_ROLE" \
               --decision-out reports/scheduling/wednesday_scheduling_decision.json \
               ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Not the Wednesday window — no work will run."
          fi
        env:
          WEDNESDAY_TIME: "04:17"
          WEDNESDAY_TZ: "America/New_York"
          WEDNESDAY_ROLE: never-blank-wednesday-golden
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FIRED_CRON: ${{ github.event.schedule }}

      # #224: written on EVERY path, including the skips — deliberately not
      # gated on `due`.
      - name: Preserve scheduling decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wednesday-scheduling-decision
          path: reports/scheduling/wednesday_scheduling_decision.json
          if-no-files-found: warn
          retention-days: 90

      - name: Install dependencies
        if: steps.window.outputs.due == 'true'
        run: pip install --quiet -r requirements.txt

      # #211: Wednesday no longer resolves its signal here. The shared
      # role-eligibility selector reads the shared research store, which the
      # 2026-07-21 supply changes retargeted at small-business feeds — the
      # regression #206 identified. Wednesday's fresh-generation runs now
      # discover their own signal inside the entrypoint, through the restored
      # July research path, so this step handles only the from-package retry,
      # where the signal was already judged in the source run.
      - name: Resolve Wednesday retry signal
        id: resolve
        if: steps.window.outputs.due == 'true'
        env:
          # #211: no model call happens in this step any more — the shared
          # eligibility selector is gone from the Wednesday path, so its
          # model secrets are no longer passed here.
          RETRY_RUN_ID: ${{ inputs.source_run_id }}
          RETRY_SIGNAL_ID: ${{ inputs.signal_id }}
          WEDNESDAY_ROLE:       never-blank-wednesday-golden
        run: |
          # #174: from-package retry short-circuit. Validated through quoted
          # env vars with a strict charset guard — inputs can never inject
          # shell or traverse paths. The signal was judged eligible in the
          # source run, so it is reloaded by identity rather than rediscovered.
          if [ -n "$RETRY_RUN_ID" ]; then
            case "$RETRY_RUN_ID" in (*[!A-Za-z0-9-]*) echo "ERROR: invalid source_run_id"; exit 1;; esac
            if [ -z "$RETRY_SIGNAL_ID" ]; then
              echo "ERROR: source_run_id requires signal_id"; exit 1
            fi
            case "$RETRY_SIGNAL_ID" in (*[!A-Za-z0-9_-]*) echo "ERROR: invalid signal_id"; exit 1;; esac
            if grep -Fxq "$RETRY_SIGNAL_ID" data/research/published_signal_ids.txt 2>/dev/null; then
              echo "ERROR: signal $RETRY_SIGNAL_ID is already published/consumed — a from-package retry may not publish it twice"
              exit 1
            fi
            echo "signal_id=$RETRY_SIGNAL_ID" >> "$GITHUB_OUTPUT"
            echo "From-package retry of run $RETRY_RUN_ID — eligibility selection skipped (already judged in the source run)."
            exit 0
          fi
          # Normal run: the entrypoint discovers the signal itself. An
          # explicitly requested signal_id is passed through as a FILTER on
          # what Wednesday's own research produces — never as a way to hand
          # the Wednesday path a signal from the shared store.
          if [ -n "${{ inputs.signal_id }}" ]; then
            case "${{ inputs.signal_id }}" in (*[!A-Za-z0-9_-]*) echo "ERROR: invalid signal_id"; exit 1;; esac
          fi
          echo "signal_id=${{ inputs.signal_id }}" >> "$GITHUB_OUTPUT"
          echo "Wednesday will discover its signal through the restored July research path."

      - name: Check OpenAI secret
        if: steps.window.outputs.due == 'true'
        run: |
          test -n "$NB_OPENAI_API_KEY" || { echo "ERROR: NB_OPENAI_API_KEY is not set"; exit 1; }
          echo "✓ NB_OPENAI_API_KEY = [SET]"
        env:
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}

      - name: Check R1 publish secrets
        if: steps.window.outputs.due == 'true' && inputs.dry_run != 'true'
        run: |
          MISSING=""
          [ -z "$NB_WIX_API_KEY" ]                && MISSING="$MISSING NB_WIX_API_KEY"
          [ -z "$NB_WIX_SITE_ID" ]                && MISSING="$MISSING NB_WIX_SITE_ID"
          [ -z "$NB_WIX_POST_OWNER_ID" ]          && MISSING="$MISSING NB_WIX_POST_OWNER_ID"
          [ -z "$NB_ZERNIO_API_KEY" ]             && MISSING="$MISSING NB_ZERNIO_API_KEY"
          [ -z "$NB_ZERNIO_LINKEDIN_ACCOUNT_ID" ] && MISSING="$MISSING NB_ZERNIO_LINKEDIN_ACCOUNT_ID"
          [ -z "$MISSING" ] || { echo "ERROR: missing publish secrets:$MISSING"; exit 1; }
          echo "✓ R1 publish secrets (Wix + LinkedIn) = [SET]"
        env:
          NB_WIX_API_KEY: ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID: ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID: ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_ZERNIO_API_KEY: ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID: ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}

      - name: "Wednesday Golden — Generate + Publish"
        id: publish
        if: steps.window.outputs.due == 'true'
        env:
          WEDNESDAY_ROLE: never-blank-wednesday-golden
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}
          # #213: NB_EXA_API_KEY is deliberately absent. Wednesday retrieves
          # its own already-selected SOURCE_URL (#211) and never constructs
          # ExaResearchAdapter, so it requires zero Exa configuration.
          NB_OPENAI_CHAT_MODEL: ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          # #173: stage-specific model routing (Issue #159) — same shared
          # infrastructure as Monday, never weekday branching.
          #
          # #213: discovery and scoring were missing here. Wednesday ran no
          # research stage of its own until #211, so nothing needed them —
          # and once it did, they fell back to NB_OPENAI_CHAT_MODEL, which
          # the provider rejected with HTTP 400 `invalid model ID` in live
          # run 33281894748. Same secrets and same convention as the daily
          # research workflow, which has always passed both.
          NB_DISCOVERY_MODEL: ${{ secrets.NB_DISCOVERY_MODEL }}
          NB_SCORING_MODEL: ${{ secrets.NB_SCORING_MODEL }}
          NB_ENRICH_MODEL: ${{ secrets.NB_ENRICH_MODEL }}
          NB_ARTICLE_MODEL: ${{ secrets.NB_ARTICLE_MODEL }}
          NB_SOCIAL_MODEL: ${{ secrets.NB_SOCIAL_MODEL }}
          # #217: restored July research + generation has a verified maximum
          # normal lifecycle of 53 calls. This finite Wednesday-only limit
          # adds three calls of headroom; Monday and roleless/default stay 40.
          NB_RUN_TEXT_CALL_BUDGET: "56"
          NB_WIX_API_KEY: ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID: ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID: ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_WIX_BLOG_CATEGORY_ID: ${{ secrets.NB_WIX_BLOG_CATEGORY_ID }}
          NB_WIX_BLOG_TAG_IDS: ${{ secrets.NB_WIX_BLOG_TAG_IDS }}
          NB_WIX_SITE_BASE_URL: ${{ secrets.NB_WIX_SITE_BASE_URL }}
          NB_ZERNIO_API_KEY: ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID: ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_CLOUDINARY_CLOUD_NAME: ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY: ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET: ${{ secrets.NB_CLOUDINARY_API_SECRET }}
          NB_FORCE_REGENERATE_RESEARCH_IMAGES: ${{ secrets.NB_FORCE_REGENERATE_RESEARCH_IMAGES }}
        run: |
          FLAGS=""
          if [ -n "$SOURCE_RUN_ID" ]; then
            case "$SOURCE_RUN_ID" in (*[!A-Za-z0-9-]*) echo "ERROR: invalid source_run_id"; exit 1;; esac
            FLAGS="$FLAGS --from-package --source-run-id $SOURCE_RUN_ID"
          fi
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="$FLAGS --dry-run"
          set +e
          python scripts/generate_and_publish.py \
            --signal-id "${{ steps.resolve.outputs.signal_id }}" \
            --editorial-role "$WEDNESDAY_ROLE" $FLAGS | tee publish.log
          RC=${PIPESTATUS[0]}
          set -e
          # #211: on a fresh Wednesday the signal id is an OUTPUT of the run,
          # not an input — the restored July research chose it. A retry keeps
          # the id it was dispatched with.
          SIGNAL_ID=$(grep '^wednesday_signal_id=' publish.log | tail -1 | cut -d= -f2)
          [ -n "$SIGNAL_ID" ] || SIGNAL_ID="${{ steps.resolve.outputs.signal_id }}"
          echo "signal_id=$SIGNAL_ID" >> "$GITHUB_OUTPUT"
          exit "$RC"

      # S3-I1 (#287): the publication idempotency authority must outlive the
      # runner. Its OWN step, and `always()`, because the marker of a
      # destination that already published must become durable even when a
      # later destination fails and the publishing step exits non-zero — that
      # partial failure is the republication this authority exists to stop.
      # A dry run persists nothing.
      - name: Persist publication markers
        if: always() && steps.window.outputs.due == 'true' && inputs.dry_run != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/ci/persist_publication_markers.sh

      - name: Mark signal as published
        if: steps.window.outputs.due == 'true' && steps.publish.outputs.signal_id != '' && success() && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          echo "${{ steps.publish.outputs.signal_id }}" >> data/research/published_signal_ids.txt
          git add data/research/published_signal_ids.txt
          git add strategy/published_content_index.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Publish Wednesday ${{ steps.publish.outputs.signal_id }} [skip ci]"
          git push

      # Uploads the whole run namespace on success AND failure, so it carries
      # the #215 pre-acceptance diagnostics (signal_snapshot.json,
      # generated_pre_acceptance.json) as well as the canonical artifacts.
      # A run blocked at a gate is precisely the one whose output needs reading.
      - name: Preserve canonical run evidence
        if: steps.window.outputs.due == 'true' && steps.publish.outputs.signal_id != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: "wednesday-run-evidence-${{ steps.publish.outputs.signal_id }}"
          path: "reports/content_packages/${{ steps.publish.outputs.signal_id }}/runs/"
          if-no-files-found: warn
          retention-days: 90
