name: Find LinkedIn URN
on:
  workflow_dispatch:
jobs:
  find-urn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Try REST /me endpoints
        env:
          NB_LINKEDIN_ACCESS_TOKEN: ${{ secrets.NB_LINKEDIN_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          token = os.environ.get("NB_LINKEDIN_ACCESS_TOKEN", "")
          
          endpoints = [
              ("https://api.linkedin.com/rest/me", {
                  "Authorization": f"Bearer {token}",
                  "LinkedIn-Version": "202504",
                  "X-Restli-Protocol-Version": "2.0.0",
              }),
              ("https://api.linkedin.com/v2/me?projection=(id)", {
                  "Authorization": f"Bearer {token}",
              }),
              ("https://api.linkedin.com/v2/me", {
                  "Authorization": f"Bearer {token}",
                  "LinkedIn-Version": "202304",
              }),
          ]
          for url, h in endpoints:
              try:
                  req = urllib.request.Request(url, headers=h)
                  with urllib.request.urlopen(req) as r:
                      d = json.loads(r.read())
                      print(f"SUCCESS {url}:")
                      print(json.dumps(d, indent=2)[:600])
              except Exception as e:
                  try:
                      body = e.read().decode() if hasattr(e, 'read') else str(e)
                  except:
                      body = str(e)
                  print(f"FAIL {url}: HTTP {getattr(e,'code','?')} {body[:200]}")
          PYEOF
