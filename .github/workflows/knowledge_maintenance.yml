# Knowledge Maintenance — the offline expiry/review pass (Step 4 §5.2, issue #297).
#
# §5.2 asks for a job that is "offline and scheduled, for example daily", that does
# not depend on a publication or a run happening, and that never blocks one. This
# workflow is that schedule.
#
# It is deliberately its own workflow rather than a step inside a publishing one:
# a production run must not wait for it, and its failure must not stop a run. The
# two schedules are independent, so this does not read `config/schedule.yaml` —
# that file is the *publication* schedule, and coupling the keeper's queue to it
# would be exactly the dependency §5.2 rules out.
#
# The daily cadence is §5.2's own example. The hour is an operational choice: it
# sits well away from the 04:17 ET publishing window so the two never contend for
# a runner, and `workflow_dispatch` can run it at any time.
name: Knowledge Maintenance

on:
  schedule:
    # 13:00 UTC = 09:00 ET. Daily, per §5.2.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      warning_days:
        description: "Days before review_by to queue a record (overrides the repository variable; 0 = window not in use)"
        required: false
        type: string
      dry_run:
        description: "Report whose review is due and write nothing"
        required: false
        default: false
        type: boolean

# The job writes queue items into the ledger and commits them.
permissions:
  contents: write

jobs:
  maintenance:
    name: Expiry and review pass
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pydantic PyYAML

      - name: Resolve the warning window
        id: window
        env:
          # Where the warning window comes from. §5.2 asks for a warning window
          # and fixes no duration, so no number is written into the code: the
          # owner sets `KNOWLEDGE_MAINTENANCE_WARNING_DAYS` as a repository
          # variable, and a manual run may override it.
          #
          # `0` is not a stand-in for a missing value. It means the warning
          # window is not in use, and the pass queues exactly what the first
          # half of §5.2 asks for: the records already past `review_by`. That
          # is the honest behaviour until the owner decides on a window, and it
          # is why an unset variable does not fail the run.
          FROM_VARIABLE: ${{ vars.KNOWLEDGE_MAINTENANCE_WARNING_DAYS }}
          FROM_DISPATCH: ${{ inputs.warning_days }}
        run: |
          days="${FROM_DISPATCH:-$FROM_VARIABLE}"
          days="${days:-0}"
          case "$days" in
            ''|*[!0-9]*)
              echo "::error::warning window must be a whole number of days; got '$days'"
              exit 1
              ;;
          esac
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "Warning window: $days day(s)"

      - name: Run the maintenance pass
        env:
          PYTHONPATH: .
        run: |
          python3 scripts/knowledge_maintenance.py \
            --warning-days "${{ steps.window.outputs.days }}" \
            ${{ (inputs.dry_run && '--dry-run') || '--commit' }}
