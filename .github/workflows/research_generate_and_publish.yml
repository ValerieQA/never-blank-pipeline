name: Research — Generate + Publish (Full LLM Cycle)

on:
  workflow_dispatch:
    inputs:
      signal_id:
        description: "SIGNAL_ID (leave empty for auto-select from signals_active.jsonl)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "dry_run=true: generate + validate only, no publish (needs only OpenAI key)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      from_package:
        description: "from_package=true: skip LLM, publish the existing _generated.json (editorial pass)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      delete_wix_post_id:
        description: "Wix post ID to delete before publishing (use when replacing an existing post)"
        required: false
        default: ""
        type: string
  schedule:
    # 3am ET (EDT = UTC-4): Fri and Sun at 07:00 UTC.
    # During EST (winter, UTC-5) this fires at 2am ET — acceptable
    #
    # Monday and Wednesday are owned by their independent canonical streams
    # (Issues #142 and #143). Friday and Sunday remain unchanged here.
    - cron: "0 7 * * 5,0"

# Serialize publish runs to prevent concurrent writes to published_content_index.jsonl
concurrency:
  group: never-blank-publish
  cancel-in-progress: false

jobs:
  generate-and-publish:
    name: "Generate + Publish"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt

      # The marker authority decides what is still unpublished, not the
      # published-signals file alone: that file is written only when a whole
      # job succeeded, so a run that published Wix and then failed LinkedIn
      # leaves the signal looking unused (NB-00b, Step 5 §1.1). An explicitly
      # dispatched signal is checked the same way — naming a signal says which
      # one to consider, not that the authority may be ignored. Exit 3 is a
      # completed search that selected nothing: publishing nothing is correct
      # and the run stays green.
      - name: Resolve signal ID
        id: resolve
        run: |
          set +e
          SIGNAL_ID=$(python scripts/streams/resolve_research_signal.py \
            --signal-id "${{ inputs.signal_id }}")
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "signal_id=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Selected signal: $SIGNAL_ID"
          echo "signal_id=$SIGNAL_ID" >> $GITHUB_OUTPUT

      # Always required: OpenAI for LLM generation
      - name: Check OpenAI secret
        run: |
          if [ -z "$NB_OPENAI_API_KEY" ]; then
            echo "ERROR: NB_OPENAI_API_KEY is not set"
            exit 1
          fi
          echo "✓ NB_OPENAI_API_KEY = [SET]"
        env:
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}

      # Only required when publishing (dry_run=false)
      - name: Check publish secrets
        if: inputs.dry_run == 'false'
        run: |
          MISSING=""
          [ -z "$NB_WIX_API_KEY" ]                && MISSING="$MISSING NB_WIX_API_KEY"
          [ -z "$NB_WIX_SITE_ID" ]                && MISSING="$MISSING NB_WIX_SITE_ID"
          [ -z "$NB_WIX_POST_OWNER_ID" ]          && MISSING="$MISSING NB_WIX_POST_OWNER_ID"
          [ -z "$NB_ZERNIO_API_KEY" ]             && MISSING="$MISSING NB_ZERNIO_API_KEY"
          [ -z "$NB_ZERNIO_LINKEDIN_ACCOUNT_ID" ] && MISSING="$MISSING NB_ZERNIO_LINKEDIN_ACCOUNT_ID"
          [ -z "$NB_META_FB_PAGE_ID" ]            && MISSING="$MISSING NB_META_FB_PAGE_ID"
          [ -z "$NB_META_FB_PAGE_TOKEN" ]         && MISSING="$MISSING NB_META_FB_PAGE_TOKEN"
          [ -z "$NB_META_IG_USER_ID" ]            && MISSING="$MISSING NB_META_IG_USER_ID"
          [ -z "$NB_THREADS_ACCESS_TOKEN" ]       && MISSING="$MISSING NB_THREADS_ACCESS_TOKEN"
          [ -z "$NB_TELEGRAM_BOT_TOKEN" ]         && MISSING="$MISSING NB_TELEGRAM_BOT_TOKEN"
          [ -z "$NB_TELEGRAM_CHANNEL_ID" ]        && MISSING="$MISSING NB_TELEGRAM_CHANNEL_ID"
          if [ -n "$MISSING" ]; then
            echo "ERROR: missing publish secrets:$MISSING"
            exit 1
          fi
          echo "✓ All publish secrets = [SET]"
        env:
          NB_WIX_API_KEY:                 ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                 ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:           ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_ZERNIO_API_KEY:              ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID:  ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_META_FB_PAGE_ID:             ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN:          ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_META_IG_USER_ID:             ${{ secrets.NB_META_IG_USER_ID }}
          NB_THREADS_ACCESS_TOKEN:        ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          NB_TELEGRAM_BOT_TOKEN:          ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID:         ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}

      - name: "Generate + Publish — ${{ steps.resolve.outputs.signal_id }}"
        # Empty means the resolver selected nothing: no unused signal, or the
        # marker authority could not answer. Either way nothing is published
        # (NB-00b). Without this guard a refusal would still reach the
        # publisher with an empty --signal-id.
        if: steps.resolve.outputs.signal_id != ''
        env:
          NB_OPENAI_API_KEY:              ${{ secrets.NB_OPENAI_API_KEY }}
          # Story #11 research evidence. Without it the canonical Exa
          # adapter fails closed and the research gate blocks generation —
          # correctly, but for a missing credential rather than missing
          # evidence (live run 32259987125).
          NB_EXA_API_KEY:                 ${{ secrets.NB_EXA_API_KEY }}
          NB_OPENAI_CHAT_MODEL:           ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          NB_WIX_API_KEY:                 ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                 ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:           ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_WIX_BLOG_CATEGORY_ID:        ${{ secrets.NB_WIX_BLOG_CATEGORY_ID }}
          NB_WIX_BLOG_TAG_IDS:            ${{ secrets.NB_WIX_BLOG_TAG_IDS }}
          NB_WIX_SITE_BASE_URL:           ${{ secrets.NB_WIX_SITE_BASE_URL }}
          NB_ZERNIO_API_KEY:              ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID:  ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_META_FB_PAGE_ID:             ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN:          ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_META_IG_USER_ID:             ${{ secrets.NB_META_IG_USER_ID }}
          NB_THREADS_ACCESS_TOKEN:        ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          NB_TELEGRAM_BOT_TOKEN:          ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID:         ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}
          NB_CLOUDINARY_CLOUD_NAME:       ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY:          ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET:       ${{ secrets.NB_CLOUDINARY_API_SECRET }}
          # Story #21 acceptance-execution setting, not production semantics.
          # The canonical visual path reuses an image_library entry when the
          # signal and design version match — which for an acceptance run
          # would mean reviewing an asset generated minutes earlier by the
          # research run rather than one produced by this publish run. With
          # the secret unset or false the existing reuse contract is untouched.
          NB_FORCE_REGENERATE_RESEARCH_IMAGES: ${{ secrets.NB_FORCE_REGENERATE_RESEARCH_IMAGES }}
        run: |
          FLAGS=""
          [ "${{ inputs.dry_run }}"       = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "${{ inputs.from_package }}"  = "true" ] && FLAGS="$FLAGS --from-package"
          [ -n "${{ inputs.delete_wix_post_id }}" ] && FLAGS="$FLAGS --delete-wix-post-id ${{ inputs.delete_wix_post_id }}"
          python scripts/generate_and_publish.py --signal-id "${{ steps.resolve.outputs.signal_id }}" $FLAGS

      # Mark signal as published so next scheduled run picks the next one
      # S3-I1 (#287): the publication idempotency authority must outlive the
      # runner. Its OWN step, and `always()`, because the marker of a
      # destination that already published must become durable even when a
      # later destination fails and the publishing step exits non-zero — that
      # partial failure is the republication this authority exists to stop.
      # A dry run persists nothing.
      - name: Persist publication markers
        if: always() && inputs.dry_run != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/ci/persist_publication_markers.sh

      - name: Mark signal as published
        if: success() && inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest (autostash handles any generated files left in the working tree)
          git pull --rebase --autostash origin main

          echo "${{ steps.resolve.outputs.signal_id }}" >> data/research/published_signal_ids.txt
          git add data/research/published_signal_ids.txt

          # Commit history index if it was updated by this run
          git add strategy/published_content_index.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Publish ${{ steps.resolve.outputs.signal_id }}: mark signal + update history [skip ci]"
          git push

      # Story #21 acceptance evidence. The canonical run namespace is written
      # into the runner's working tree and would otherwise be destroyed with
      # the runner, leaving a real publication with nothing to verify against
      # (Story #16 provenance, Story #20 run_report, Story #21 closure).
      #
      # The path is derived from the signal the run was launched with — run_id
      # is generated inside the process, so it is never knowable in advance and
      # is deliberately not reconstructed from logs or a marker file.
      #
      # always(): a blocked preflight or a failed publication is evidence under
      # Story #21, and run_report.json is written on those paths too. Uploading
      # only on success would discard exactly the runs that matter most.
      #
      # Placed AFTER bookkeeping on purpose. "Mark signal as published" is
      # guarded by success(), so an evidence upload standing in front of it
      # could fail for an unrelated artifact-service reason and silently
      # suppress the record of a publication that really happened — leaving a
      # later run free to treat the signal as unconsumed. Evidence must never
      # be able to veto bookkeeping; always() keeps it running regardless of
      # what happened upstream.
      - name: Preserve canonical run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "run-evidence-${{ steps.resolve.outputs.signal_id }}"
          path: "reports/content_packages/${{ steps.resolve.outputs.signal_id }}/runs/"
          if-no-files-found: warn
          retention-days: 90

      - name: Upload generated package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "generated-${{ steps.resolve.outputs.signal_id }}"
          path: "reports/content_packages/${{ steps.resolve.outputs.signal_id }}_generated.json"
          if-no-files-found: ignore
          retention-days: 90
