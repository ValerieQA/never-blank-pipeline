name: Research — Generate + Publish (Full LLM Cycle)

on:
  workflow_dispatch:
    inputs:
      signal_id:
        description: "SIGNAL_ID (leave empty for auto-select from signals_active.jsonl)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "dry_run=true: generate + validate only, no publish (needs only OpenAI key)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      from_package:
        description: "from_package=true: skip LLM, publish the existing _generated.json (editorial pass)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      delete_wix_post_id:
        description: "Wix post ID to delete before publishing (use when replacing an existing post)"
        required: false
        default: ""
        type: string
  schedule:
    # 3am ET (EDT = UTC-4): Mon, Wed, Fri, Sun at 07:00 UTC
    # During EST (winter, UTC-5) this fires at 2am ET — acceptable
    - cron: "0 7 * * 1,3,5,0"

# Serialize publish runs to prevent concurrent writes to published_content_index.jsonl
concurrency:
  group: never-blank-publish
  cancel-in-progress: false

jobs:
  generate-and-publish:
    name: "Generate + Publish"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt

      # Auto-select signal if none provided (scheduled runs)
      - name: Resolve signal ID
        id: resolve
        run: |
          SIGNAL_ID="${{ inputs.signal_id }}"
          if [ -z "$SIGNAL_ID" ]; then
            SIGNAL_ID=$(python - <<'EOF'
          import json, pathlib

          active = pathlib.Path("data/research/signals_active.jsonl")
          published = pathlib.Path("data/research/published_signal_ids.txt")
          done = set(published.read_text().splitlines()) if published.exists() else set()

          for line in active.read_text().splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  obj = json.loads(line)
                  sid = obj.get("SIGNAL_ID", "")
                  if sid and sid not in done:
                      print(sid)
                      break
              except Exception:
                  pass
          EOF
            )
            echo "Auto-selected signal: $SIGNAL_ID"
          fi
          echo "signal_id=$SIGNAL_ID" >> $GITHUB_OUTPUT

      # Always required: OpenAI for LLM generation
      - name: Check OpenAI secret
        run: |
          if [ -z "$NB_OPENAI_API_KEY" ]; then
            echo "ERROR: NB_OPENAI_API_KEY is not set"
            exit 1
          fi
          echo "✓ NB_OPENAI_API_KEY = [SET]"
        env:
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}

      # Only required when publishing (dry_run=false)
      - name: Check publish secrets
        if: inputs.dry_run == 'false'
        run: |
          MISSING=""
          [ -z "$NB_WIX_API_KEY" ]                && MISSING="$MISSING NB_WIX_API_KEY"
          [ -z "$NB_WIX_SITE_ID" ]                && MISSING="$MISSING NB_WIX_SITE_ID"
          [ -z "$NB_WIX_POST_OWNER_ID" ]          && MISSING="$MISSING NB_WIX_POST_OWNER_ID"
          [ -z "$NB_ZERNIO_API_KEY" ]             && MISSING="$MISSING NB_ZERNIO_API_KEY"
          [ -z "$NB_ZERNIO_LINKEDIN_ACCOUNT_ID" ] && MISSING="$MISSING NB_ZERNIO_LINKEDIN_ACCOUNT_ID"
          [ -z "$NB_META_FB_PAGE_ID" ]            && MISSING="$MISSING NB_META_FB_PAGE_ID"
          [ -z "$NB_META_FB_PAGE_TOKEN" ]         && MISSING="$MISSING NB_META_FB_PAGE_TOKEN"
          [ -z "$NB_META_IG_USER_ID" ]            && MISSING="$MISSING NB_META_IG_USER_ID"
          [ -z "$NB_THREADS_ACCESS_TOKEN" ]       && MISSING="$MISSING NB_THREADS_ACCESS_TOKEN"
          [ -z "$NB_TELEGRAM_BOT_TOKEN" ]         && MISSING="$MISSING NB_TELEGRAM_BOT_TOKEN"
          [ -z "$NB_TELEGRAM_CHANNEL_ID" ]        && MISSING="$MISSING NB_TELEGRAM_CHANNEL_ID"
          if [ -n "$MISSING" ]; then
            echo "ERROR: missing publish secrets:$MISSING"
            exit 1
          fi
          echo "✓ All publish secrets = [SET]"
        env:
          NB_WIX_API_KEY:                 ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                 ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:           ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_ZERNIO_API_KEY:              ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID:  ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_META_FB_PAGE_ID:             ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN:          ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_META_IG_USER_ID:             ${{ secrets.NB_META_IG_USER_ID }}
          NB_THREADS_ACCESS_TOKEN:        ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          NB_TELEGRAM_BOT_TOKEN:          ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID:         ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}

      - name: "Generate + Publish — ${{ steps.resolve.outputs.signal_id }}"
        env:
          NB_OPENAI_API_KEY:              ${{ secrets.NB_OPENAI_API_KEY }}
          NB_OPENAI_CHAT_MODEL:           ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          NB_WIX_API_KEY:                 ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                 ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:           ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_WIX_BLOG_CATEGORY_ID:        ${{ secrets.NB_WIX_BLOG_CATEGORY_ID }}
          NB_WIX_BLOG_TAG_IDS:            ${{ secrets.NB_WIX_BLOG_TAG_IDS }}
          NB_WIX_SITE_BASE_URL:           ${{ secrets.NB_WIX_SITE_BASE_URL }}
          NB_ZERNIO_API_KEY:              ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID:  ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_META_FB_PAGE_ID:             ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN:          ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_META_IG_USER_ID:             ${{ secrets.NB_META_IG_USER_ID }}
          NB_THREADS_ACCESS_TOKEN:        ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          NB_TELEGRAM_BOT_TOKEN:          ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID:         ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}
          NB_CLOUDINARY_CLOUD_NAME:       ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY:          ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET:       ${{ secrets.NB_CLOUDINARY_API_SECRET }}
        run: |
          FLAGS=""
          [ "${{ inputs.dry_run }}"       = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "${{ inputs.from_package }}"  = "true" ] && FLAGS="$FLAGS --from-package"
          [ -n "${{ inputs.delete_wix_post_id }}" ] && FLAGS="$FLAGS --delete-wix-post-id ${{ inputs.delete_wix_post_id }}"
          python scripts/generate_and_publish.py --signal-id "${{ steps.resolve.outputs.signal_id }}" $FLAGS

      # Mark signal as published so next scheduled run picks the next one
      - name: Mark signal as published
        if: success() && inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest (autostash handles any generated files left in the working tree)
          git pull --rebase --autostash origin main

          echo "${{ steps.resolve.outputs.signal_id }}" >> data/research/published_signal_ids.txt
          git add data/research/published_signal_ids.txt

          # Commit history index if it was updated by this run
          git add strategy/published_content_index.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Publish ${{ steps.resolve.outputs.signal_id }}: mark signal + update history [skip ci]"
          git push

      - name: Upload generated package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "generated-${{ steps.resolve.outputs.signal_id }}"
          path: "reports/content_packages/${{ steps.resolve.outputs.signal_id }}_generated.json"
          if-no-files-found: ignore
