name: Monday — Never Blank Business Case

# The Monday editorial stream (Issue #142): one real business case, one
# business mechanism, one bounded consequence.
#
# Independent by design. Monday owns this workflow and nothing else runs in
# it, so a broken Monday cannot stop Tuesday, Wednesday, Thursday or Friday —
# and none of them can stop Monday.
#
# Schedule ownership: this is the ONLY authoritative Monday publisher. The
# legacy Mon/Wed/Fri scheduler and the canonical multi-day workflow both had
# Monday removed in the same change (Issue #142), because two publishers on
# one day is two articles, and the consumption marker is written after a run
# rather than before it — it can never act as a concurrency guard.
#
# The time is the accepted contract from config/schedule.yaml —
# America/New_York 06:00 — not a new invention.

on:
  schedule:
    - cron: "0 10 * * 1"   # 10:00 UTC = 06:00 ET (EDT)
    - cron: "0 11 * * 1"   # 11:00 UTC = 06:00 ET (EST)

  workflow_dispatch:
    inputs:
      signal_id:
        description: "SIGNAL_ID (leave empty to auto-select an unused eligible signal)"
        required: false
        default: ""
        type: string
      source_run_id:
        description: "Republish an existing completed generation run via --from-package (requires signal_id; leave empty for a normal automatic run)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "dry_run=true: generate + validate only, no publish"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# Serialize against the other publish streams: they share the published-content
# index and the signal consumption marker.
concurrency:
  group: never-blank-publish
  cancel-in-progress: false

jobs:
  monday-publish:
    name: "Monday — Never Blank Business Case"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub cron is UTC, so the schedule above fires twice — once correct
      # under EDT, once under EST. This decides which firing is the real one,
      # before anything is generated or any credential is read. A manual
      # dispatch is always the real one.
      - name: Monday publish window
        id: window
        run: |
          if python scripts/streams/due_check.py \
               --day monday --time "$MONDAY_TIME" --timezone "$MONDAY_TZ" \
               ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}; then
            echo "due=true" >> $GITHUB_OUTPUT
          else
            echo "due=false" >> $GITHUB_OUTPUT
            echo "Not the Monday window — no work will run."
          fi
        env:
          MONDAY_TIME: "06:00"
          MONDAY_TZ: "America/New_York"

      - run: pip install --quiet -r requirements.txt
        if: steps.window.outputs.due == 'true'

      # Auto-select signal if none provided (scheduled runs)
      # Corrected #142: Monday does not take the first unused signal — it takes
      # the first unused signal in the allowed R1 Monday source class. The
      # selector judges each candidate against the role's configured
      # eligibility criteria, fails closed on uncertainty, and exits 3 when no
      # eligible candidate exists — in which case publishing nothing is the
      # correct outcome, never a fallback to an analogy case. An explicitly
      # dispatched signal_id is judged too; explicitness is not an eligibility
      # bypass. Rejected candidates are only skipped — nothing here marks
      # anything published.
      - name: Select eligible signal
        id: resolve
        if: steps.window.outputs.due == 'true'
        env:
          NB_OPENAI_API_KEY:    ${{ secrets.NB_OPENAI_API_KEY }}
          NB_OPENAI_CHAT_MODEL: ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          # #173: the eligibility judgment is enrichment-class work; the
          # stage model routes it without touching the global fallback.
          NB_ENRICH_MODEL: ${{ secrets.NB_ENRICH_MODEL }}
          RETRY_RUN_ID: ${{ inputs.source_run_id }}
          RETRY_SIGNAL_ID: ${{ inputs.signal_id }}
          MONDAY_ROLE:          never-blank-monday-documented-case
        run: |
          # #174: from-package retry short-circuit. Validated through quoted
          # env vars with a strict charset guard — inputs can never inject
          # shell or traverse paths. The signal was judged eligible in the
          # source run; the selector is skipped, costing zero model calls.
          if [ -n "$RETRY_RUN_ID" ]; then
            case "$RETRY_RUN_ID" in (*[!A-Za-z0-9-]*) echo "ERROR: invalid source_run_id"; exit 1;; esac
            if [ -z "$RETRY_SIGNAL_ID" ]; then
              echo "ERROR: source_run_id requires signal_id"; exit 1
            fi
            case "$RETRY_SIGNAL_ID" in (*[!A-Za-z0-9_-]*) echo "ERROR: invalid signal_id"; exit 1;; esac
            if grep -Fxq "$RETRY_SIGNAL_ID" data/research/published_signal_ids.txt 2>/dev/null; then
              echo "ERROR: signal $RETRY_SIGNAL_ID is already published/consumed — a from-package retry may not publish it twice"
              exit 1
            fi
            echo "signal_id=$RETRY_SIGNAL_ID" >> "$GITHUB_OUTPUT"
            echo "From-package retry of run $RETRY_RUN_ID — eligibility selection skipped (already judged in the source run)."
            exit 0
          fi
          set +e
          python scripts/streams/select_eligible_signal.py \
            --editorial-role "$MONDAY_ROLE" \
            --signal-id "${{ inputs.signal_id }}" \
            --audit-out reports/stream_selection/monday_selection.json \
            | tee selection.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" = "3" ]; then
            # A completed all-ineligible search: publishing nothing is the
            # correct outcome, and the run stays green.
            echo "signal_id=" >> $GITHUB_OUTPUT
            echo "No eligible Monday candidate — publishing nothing."
            exit 0
          elif [ "$RC" != "0" ]; then
            # Exit 4 (eligibility infrastructure failure), exit 5 (incomplete
            # search — unevaluated candidates remain, one of which may be
            # eligible) and any other error fail the run visibly — never
            # converted into a quiet "nothing to publish".
            exit "$RC"
          fi
          SIGNAL_ID=$(grep '^selected=' selection.log | tail -1 | cut -d= -f2)
          echo "signal_id=$SIGNAL_ID" >> $GITHUB_OUTPUT

      # Why a signal was selected or skipped must be answerable from evidence.
      - name: Preserve selection audit
        if: steps.window.outputs.due == 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: monday-selection-audit
          path: reports/stream_selection/monday_selection.json
          if-no-files-found: warn
          retention-days: 90

      - name: Check OpenAI secret
        if: steps.window.outputs.due == 'true' && steps.resolve.outputs.signal_id != ''
        run: |
          if [ -z "$NB_OPENAI_API_KEY" ]; then
            echo "ERROR: NB_OPENAI_API_KEY is not set"
            exit 1
          fi
          echo "✓ NB_OPENAI_API_KEY = [SET]"
        env:
          NB_OPENAI_API_KEY: ${{ secrets.NB_OPENAI_API_KEY }}

      # Release 1 Monday publishes Wix + LinkedIn only. Required secrets are
      # exactly those two surfaces' — a missing Meta/Threads/Telegram credential
      # must never block a valid Monday run.
      - name: Check publish secrets
        if: steps.window.outputs.due == 'true' && steps.resolve.outputs.signal_id != '' && (inputs.dry_run != 'true')
        run: |
          MISSING=""
          [ -z "$NB_WIX_API_KEY" ]                && MISSING="$MISSING NB_WIX_API_KEY"
          [ -z "$NB_WIX_SITE_ID" ]                && MISSING="$MISSING NB_WIX_SITE_ID"
          [ -z "$NB_WIX_POST_OWNER_ID" ]          && MISSING="$MISSING NB_WIX_POST_OWNER_ID"
          [ -z "$NB_ZERNIO_API_KEY" ]             && MISSING="$MISSING NB_ZERNIO_API_KEY"
          [ -z "$NB_ZERNIO_LINKEDIN_ACCOUNT_ID" ] && MISSING="$MISSING NB_ZERNIO_LINKEDIN_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "ERROR: missing publish secrets:$MISSING"
            exit 1
          fi
          echo "✓ R1 publish secrets (Wix + LinkedIn) = [SET]"
        env:
          NB_WIX_API_KEY:                 ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                 ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:           ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_ZERNIO_API_KEY:              ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID:  ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}

      - name: "Monday — Generate + Publish ${{ steps.resolve.outputs.signal_id }}"
        if: steps.window.outputs.due == 'true' && steps.resolve.outputs.signal_id != ''
        env:
          MONDAY_ROLE:                    never-blank-monday-documented-case
          SOURCE_RUN_ID:                  ${{ inputs.source_run_id }}
          NB_OPENAI_API_KEY:              ${{ secrets.NB_OPENAI_API_KEY }}
          # Story #11 research evidence. Without it the canonical Exa
          # adapter fails closed and the research gate blocks generation —
          # correctly, but for a missing credential rather than missing
          # evidence (live run 32259987125).
          NB_EXA_API_KEY:                 ${{ secrets.NB_EXA_API_KEY }}
          NB_OPENAI_CHAT_MODEL:           ${{ secrets.NB_OPENAI_CHAT_MODEL }}
          # #173: stage-specific model routing (Issue #159). The client has
          # always supported these; the workflow simply never passed them,
          # collapsing every stage onto the global model. Unset secrets
          # render as empty strings, which the client treats as absent.
          NB_ENRICH_MODEL:                ${{ secrets.NB_ENRICH_MODEL }}
          NB_ARTICLE_MODEL:               ${{ secrets.NB_ARTICLE_MODEL }}
          NB_SOCIAL_MODEL:                ${{ secrets.NB_SOCIAL_MODEL }}
          NB_WIX_API_KEY:                 ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                 ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:           ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_WIX_BLOG_CATEGORY_ID:        ${{ secrets.NB_WIX_BLOG_CATEGORY_ID }}
          NB_WIX_BLOG_TAG_IDS:            ${{ secrets.NB_WIX_BLOG_TAG_IDS }}
          NB_WIX_SITE_BASE_URL:           ${{ secrets.NB_WIX_SITE_BASE_URL }}
          NB_ZERNIO_API_KEY:              ${{ secrets.NB_ZERNIO_API_KEY }}
          NB_ZERNIO_LINKEDIN_ACCOUNT_ID:  ${{ secrets.NB_ZERNIO_LINKEDIN_ACCOUNT_ID }}
          NB_CLOUDINARY_CLOUD_NAME:       ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY:          ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET:       ${{ secrets.NB_CLOUDINARY_API_SECRET }}
          # Story #21 acceptance-execution setting, not production semantics.
          # The canonical visual path reuses an image_library entry when the
          # signal and design version match — which for an acceptance run
          # would mean reviewing an asset generated minutes earlier by the
          # research run rather than one produced by this publish run. With
          # the secret unset or false the existing reuse contract is untouched.
          NB_FORCE_REGENERATE_RESEARCH_IMAGES: ${{ secrets.NB_FORCE_REGENERATE_RESEARCH_IMAGES }}
        run: |
          FLAGS=""
          if [ -n "$SOURCE_RUN_ID" ]; then
            case "$SOURCE_RUN_ID" in (*[!A-Za-z0-9-]*) echo "ERROR: invalid source_run_id"; exit 1;; esac
            FLAGS="$FLAGS --from-package --source-run-id $SOURCE_RUN_ID"
          fi
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="$FLAGS --dry-run"
          python scripts/generate_and_publish.py \
            --signal-id "${{ steps.resolve.outputs.signal_id }}" \
            --editorial-role "$MONDAY_ROLE" $FLAGS

      # Mark signal as published so next scheduled run picks the next one
      - name: Mark signal as published
        if: steps.window.outputs.due == 'true' && steps.resolve.outputs.signal_id != '' && (success() && inputs.dry_run != 'true')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest (autostash handles any generated files left in the working tree)
          git pull --rebase --autostash origin main

          echo "${{ steps.resolve.outputs.signal_id }}" >> data/research/published_signal_ids.txt
          git add data/research/published_signal_ids.txt

          # Commit history index if it was updated by this run
          git add strategy/published_content_index.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Publish ${{ steps.resolve.outputs.signal_id }}: mark signal + update history [skip ci]"
          git push

      # Story #21 acceptance evidence. The canonical run namespace is written
      # into the runner's working tree and would otherwise be destroyed with
      # the runner, leaving a real publication with nothing to verify against
      # (Story #16 provenance, Story #20 run_report, Story #21 closure).
      #
      # The path is derived from the signal the run was launched with — run_id
      # is generated inside the process, so it is never knowable in advance and
      # is deliberately not reconstructed from logs or a marker file.
      #
      # always(): a blocked preflight or a failed publication is evidence under
      # Story #21, and run_report.json is written on those paths too. Uploading
      # only on success would discard exactly the runs that matter most.
      #
      # Placed AFTER bookkeeping on purpose. "Mark signal as published" is
      # guarded by success(), so an evidence upload standing in front of it
      # could fail for an unrelated artifact-service reason and silently
      # suppress the record of a publication that really happened — leaving a
      # later run free to treat the signal as unconsumed. Evidence must never
      # be able to veto bookkeeping; always() keeps it running regardless of
      # what happened upstream.
      - name: Preserve canonical run evidence
        if: steps.window.outputs.due == 'true' && steps.resolve.outputs.signal_id != '' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: "run-evidence-${{ steps.resolve.outputs.signal_id }}"
          path: "reports/content_packages/${{ steps.resolve.outputs.signal_id }}/runs/"
          if-no-files-found: warn
          retention-days: 90

      - name: Upload generated package
        if: steps.window.outputs.due == 'true' && steps.resolve.outputs.signal_id != '' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: "generated-${{ steps.resolve.outputs.signal_id }}"
          path: "reports/content_packages/${{ steps.resolve.outputs.signal_id }}_generated.json"
          if-no-files-found: ignore
