name: Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publishing mode"
        required: true
        type: choice
        options:
          - dry-run
          - draft-only
          - live
      channels:
        description: "Channels (comma-separated, leave blank for all)"
        required: false
        default: ""

jobs:
  publish:
    name: Publish (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet python-dotenv openai Pillow cloudinary PyYAML

      - name: Create test fixture (if no generated draft exists)
        run: |
          if [ ! -f data/drafts/latest/metadata.json ]; then
            python scripts/create_fixture.py
          fi

      - name: Generate image (if no image_url.txt yet)
        env:
          NB_OPENAI_API_KEY:        ${{ secrets.NB_OPENAI_API_KEY }}
          NB_CLOUDINARY_CLOUD_NAME: ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY:    ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET: ${{ secrets.NB_CLOUDINARY_API_SECRET }}
        run: |
          if [ ! -f data/drafts/latest/image_url.txt ]; then
            python scripts/generate_image.py --upload
          else
            echo "image_url.txt already exists — skipping image generation"
          fi

      - name: Run publisher
        env:
          NB_OPENAI_API_KEY:                 ${{ secrets.NB_OPENAI_API_KEY }}
          NB_WIX_API_KEY:                    ${{ secrets.NB_WIX_API_KEY }}
          NB_WIX_SITE_ID:                    ${{ secrets.NB_WIX_SITE_ID }}
          NB_WIX_POST_OWNER_ID:              ${{ secrets.NB_WIX_POST_OWNER_ID }}
          NB_LINKEDIN_ACCESS_TOKEN:          ${{ secrets.NB_LINKEDIN_ACCESS_TOKEN }}
          NB_LINKEDIN_CLIENT_ID:             ${{ secrets.NB_LINKEDIN_CLIENT_ID }}
          NB_LINKEDIN_CLIENT_SECRET:         ${{ secrets.NB_LINKEDIN_CLIENT_SECRET }}
          NB_LINKEDIN_AUTHOR_URN:            ${{ secrets.NB_LINKEDIN_AUTHOR_URN }}
          NB_META_USER_TOKEN:                ${{ secrets.NB_META_USER_TOKEN }}
          NB_META_IG_USER_ID:                ${{ secrets.NB_META_IG_USER_ID }}
          NB_META_FB_PAGE_ID:                ${{ secrets.NB_META_FB_PAGE_ID }}
          NB_META_FB_PAGE_TOKEN:             ${{ secrets.NB_META_FB_PAGE_TOKEN }}
          NB_THREADS_ACCESS_TOKEN:           ${{ secrets.NB_THREADS_ACCESS_TOKEN }}
          NB_TELEGRAM_BOT_TOKEN:             ${{ secrets.NB_TELEGRAM_BOT_TOKEN }}
          NB_TELEGRAM_CHANNEL_ID:            ${{ secrets.NB_TELEGRAM_CHANNEL_ID }}
          NB_CLOUDINARY_CLOUD_NAME:          ${{ secrets.NB_CLOUDINARY_CLOUD_NAME }}
          NB_CLOUDINARY_API_KEY:             ${{ secrets.NB_CLOUDINARY_API_KEY }}
          NB_CLOUDINARY_API_SECRET:          ${{ secrets.NB_CLOUDINARY_API_SECRET }}
          NB_GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.NB_GOOGLE_SHEETS_CREDENTIALS_JSON }}
          NB_GOOGLE_SHEET_ID:                ${{ secrets.NB_GOOGLE_SHEET_ID }}
        run: |
          CHANNELS="${{ inputs.channels }}"
          if [ -n "$CHANNELS" ]; then
            python scripts/publish.py --${{ inputs.mode }} --channels "$CHANNELS"
          else
            python scripts/publish.py --${{ inputs.mode }}
          fi

      - name: Upload publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-report-${{ github.run_id }}
          path: reports/publish_report.*
          retention-days: 30

      - name: Print report summary
        if: always()
        run: |
          echo "## Publish Report" >> $GITHUB_STEP_SUMMARY
          cat reports/publish_report.md >> $GITHUB_STEP_SUMMARY
