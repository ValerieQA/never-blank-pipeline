name: Editorial Publishing Preflight

on:
  push:
    branches: [main]
    paths:
      - "scripts/research/**"
      - "src/editorial/**"
      - "src/content/output_guard.py"
      - "tests/test_output_guard.py"
      # how pytest is configured, and what CI installs, decide whether this
      # job can import anything at all
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/editorial_preflight.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # the declared dependencies, exactly as the PR gate installs them:
        # a hand-picked subset silently drifts from what the code imports
        run: pip install --quiet -r requirements.txt pytest pydantic
      - name: Compile publishing path
        run: |
          python -m py_compile scripts/research/run_daily_research.py
          python -m py_compile scripts/research/publish_packages.py
          python -m py_compile src/content/output_guard.py
          python -m py_compile src/editorial/pipeline.py
      - name: Run output guard tests
        run: pytest -q tests/test_output_guard.py
